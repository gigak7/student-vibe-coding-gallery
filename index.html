<script>
(function(){
  var voted = {};
  try { voted = JSON.parse(localStorage.getItem('votedGames') || '{}'); } catch(e){}
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function qsa(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function paintCounts(votes){
    qsa('[data-votes-for]').forEach(function(el){
      var id = el.getAttribute('data-votes-for');
      el.textContent = votes[id] || 0;
    });
    var box = document.getElementById('top3');
    if (box && window.GAME_META){
      var arr = Object.keys(window.GAME_META).map(function(id){
        return { id:id, v: votes[id] || 0 };
      }).filter(function(x){ return x.v > 0; })
        .sort(function(a,b){ return b.v - a.v; }).slice(0,3);
      if (!arr.length){
        box.innerHTML = '<p class="desc">還沒有投票，快去試玩並投下你的一票吧！</p>';
        return;
      }
      var medals = ['🥇','🥈','🥉'];
      box.innerHTML = arr.map(function(x, i){
        var m = window.GAME_META[x.id] || {};
        return '<a class="top3-row" href="'+esc(m.url||'#')+'" target="_blank" rel="noopener">'
          + '<span class="medal">'+medals[i]+'</span>'
          + '<span class="t-title">'+esc(m.title||x.id)+'</span>'
          + '<span class="t-author">'+esc(m.author||'')+'</span>'
          + '<span class="t-votes">👍 '+x.v+'</span></a>';
      }).join('');
    }
  }
  function paintVoted(){
    qsa('[data-vote-btn]').forEach(function(btn){
      var id = btn.getAttribute('data-vote-btn');
      if (voted[id]){
        btn.classList.add('voted');
        var label = btn.querySelector('.vote-label');
        if (label) label.textContent = '✓ 已投票';
      }
    });
  }
  function loadVotes(){
    return fetch('/api/votes', {cache:'no-store'}).then(function(r){
      return r.ok ? r.json() : {};
    }).catch(function(){ return {}; });
  }
  function refresh(){ loadVotes().then(paintCounts); }
  document.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('[data-vote-btn]') : null;
    if (!btn) return;
    var id = btn.getAttribute('data-vote-btn');
    if (voted[id] || btn.disabled) return;
    btn.disabled = true;
    fetch('/api/vote', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id:id})
    }).then(function(r){ return r.json().then(function(d){ return {r:r, d:d}; }); })
    .then(function(x){
      if (x.r.status === 429){
        alert('投票太頻繁，請 ' + (x.d.retryAfter || 60) + ' 秒後再試');
      } else if (x.r.ok){
        voted[id] = 1;
        try { localStorage.setItem('votedGames', JSON.stringify(voted)); } catch(e2){}
        paintVoted();
      }
    }).catch(function(){}).then(function(){
      btn.disabled = false;
      refresh();
    });
  });
  paintVoted();
  refresh();
})();
</script>
