<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空射擊戰 - 擴大場地版 (600x750)</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }

        /* 遊戲畫面容器 (已擴大為 600x750) */
        #game-container {
            width: 600px;
            height: 750px;
            border: 2px solid #555;
            position: relative;
            background-color: #050515;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        /* 頂部資訊看板 */
        #ui-bar {
            position: absolute;
            top: 12px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            z-index: 10;
            user-select: none;
            text-shadow: 0 0 4px #000;
        }

        /* 血條樣式 */
        #hp-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #hp-bar-outer {
            width: 140px;
            height: 14px;
            background-color: #444;
            border: 1px solid #fff;
            border-radius: 7px;
            overflow: hidden;
        }

        #hp-bar-inner {
            width: 100%;
            height: 100%;
            background-color: #00ff66;
            transition: width 0.2s, background-color 0.2s;
        }

        /* 火箭元素 */
        #rocket {
            font-size: 40px;
            position: absolute;
            bottom: 20px;
            left: 280px; /* (600 - 40) / 2 置中 */
            user-select: none;
            line-height: 1;
        }

        /* 普通玩家子彈 */
        .bullet {
            width: 4px;
            height: 14px;
            background-color: #ff0;
            position: absolute;
            border-radius: 2px;
            box-shadow: 0 0 4px #ff0;
        }

        /* 暴擊玩家子彈 (紅色加粗加亮) */
        .bullet-crit {
            width: 6px;
            height: 18px;
            background-color: #ff3300;
            position: absolute;
            border-radius: 3px;
            box-shadow: 0 0 8px #ff3300, 0 0 12px #ffff00;
        }

        /* 外星人子彈元素 */
        .alien-bullet {
            width: 6px;
            height: 16px;
            background-color: #ff0055;
            position: absolute;
            border-radius: 3px;
            box-shadow: 0 0 6px #ff0055;
        }

        /* 外星人元素 */
        .alien {
            font-size: 26px;
            position: absolute;
            user-select: none;
            line-height: 1;
            text-align: center;
            width: 32px;
            height: 32px;
        }

        /* 普通爆炸特效 */
        .explosion {
            font-size: 30px;
            position: absolute;
            user-select: none;
            pointer-events: none;
            animation: explode 0.3s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: scale(0.8); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        /* 暴擊飄字特效 (CRIT!) */
        .crit-text {
            position: absolute;
            color: #ffff00;
            font-size: 18px;
            font-weight: 900;
            font-style: italic;
            text-shadow: 0 0 6px #ff0000, 2px 2px 2px #000;
            user-select: none;
            pointer-events: none;
            animation: floatUp 0.5s ease-out forwards;
            z-index: 15;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            50% { transform: translateY(-15px) scale(1.4); opacity: 0.9; }
            100% { transform: translateY(-30px) scale(1.1); opacity: 0; }
        }

        /* 遊戲結束/結算畫面 Overlay */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            display: none;
        }

        #game-over-screen h1 {
            color: #ff3333;
            font-size: 48px;
            margin: 0 0 10px 0;
            text-shadow: 0 0 15px #ff0000;
            letter-spacing: 3px;
        }

        #final-score {
            font-size: 26px;
            margin: 10px 0 30px 0;
            color: #ffcc00;
            font-weight: bold;
        }

        /* Defend Again 按鈕風格 */
        #defend-again-btn {
            padding: 14px 36px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(180deg, #ff4444, #cc0000);
            border: 2px solid #ff6666;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.6);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        #defend-again-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 51, 51, 0.9);
        }

        #defend-again-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 頂部 UI 情報欄 -->
        <div id="ui-bar">
            <div id="hp-container">
                <span>❤️</span>
                <div id="hp-bar-outer">
                    <div id="hp-bar-inner"></div>
                </div>
            </div>
            <div id="score-display">Score: 0</div>
            <div id="wave-display">Wave: 1</div>
        </div>

        <!-- 玩家控制的火箭 -->
        <div id="rocket">🚀</div>

        <!-- 結束畫面 -->
        <div id="game-over-screen">
            <h1>GAME OVER</h1>
            <div id="final-score">最終分數：0</div>
            <button id="defend-again-btn" onclick="resetGame()">Defend Again</button>
        </div>
    </div>

    <script>
        // 取得 DOM 元素
        const container = document.getElementById('game-container');
        const rocket = document.getElementById('rocket');
        const scoreDisplay = document.getElementById('score-display');
        const waveDisplay = document.getElementById('wave-display');
        const hpBarInner = document.getElementById('hp-bar-inner');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScore = document.getElementById('final-score');

        // 場地尺寸動態讀取
        const containerWidth = container.clientWidth;   // 600
        const containerHeight = container.clientHeight; // 750

        // 玩家火箭屬性與狀態
        const rocketWidth = 40;
        const rocketHeight = 40;
        let rocketX = (containerWidth - rocketWidth) / 2; // 開局置中 (280)
        const rocketSpeed = 6; // 因場地變大，稍微提升移動速度

        const playerMaxHp = 3000000;
        let playerHp = playerMaxHp;

        // 子彈陣列
        const bullets = []; // 玩家子彈
        const alienBullets = []; // 外星人子彈

        const bulletSpeed = 9;
        const alienBulletSpeed = 4.5;
        const baseBulletDamage = 500000;
        const alienBulletDamage = 500000;
        let canShoot = true;

        // 遊戲狀態 (分數與波次)
        let score = 0;
        let wave = 1;
        let isGameOver = false;
        let alienAttackTimer = null;

        // 外星人設定
        const alienRows = 9;
        const alienCols = 9;
        const alienEmojis = ['👾', '🛸', '👽', '🤖'];
        let aliens = [];

        // 外星人移動與難度變數
        let baseSpeed = 1.0;
        let alienSpeed = baseSpeed;
        let alienDirection = 1;
        const speedAcceleration = 0.3;
        const dropDistance = 18;

        // 建立外星人陣列
        function createAliens() {
            aliens.forEach(a => a.element.remove());
            aliens = [];

            const startX = 30;
            const startY = 50;
            const spacingX = (containerWidth - (startX * 2)) / (alienCols - 1); // 自動根據 600px 寬度分佈
            const spacingY = 38;

            for (let row = 0; row < alienRows; row++) {
                for (let col = 0; col < alienCols; col++) {
                    const emojiIndex = (row * alienCols + col) % alienEmojis.length;
                    const emoji = alienEmojis[emojiIndex];

                    const x = startX + (col * spacingX) - 16;
                    const y = startY + (row * spacingY);

                    const alienElement = document.createElement('div');
                    alienElement.className = 'alien';
                    alienElement.innerText = emoji;
                    alienElement.style.left = x + 'px';
                    alienElement.style.top = y + 'px';
                    container.appendChild(alienElement);

                    aliens.push({
                        x: x,
                        y: y,
                        type: emoji,
                        hp: 3000000,
                        element: alienElement
                    });
                }
            }
        }

        // 定時外星人隨機發射子彈 (每 5 秒)
        function startAlienAttackTimer() {
            if (alienAttackTimer) clearInterval(alienAttackTimer);

            alienAttackTimer = setInterval(() => {
                if (isGameOver || aliens.length === 0) return;

                const randomIndex = Math.floor(Math.random() * aliens.length);
                const shooter = aliens[randomIndex];

                const bulletX = shooter.x + 16 - 3;
                const bulletY = shooter.y + 32;

                const bulletElement = document.createElement('div');
                bulletElement.className = 'alien-bullet';
                bulletElement.style.left = bulletX + 'px';
                bulletElement.style.top = bulletY + 'px';
                container.appendChild(bulletElement);

                alienBullets.push({
                    x: bulletX,
                    y: bulletY,
                    width: 6,
                    height: 16,
                    damage: alienBulletDamage,
                    element: bulletElement
                });
            }, 5000);
        }

        // 更新玩家 UI 血條
        function updateHpBar() {
            const hpPercent = Math.max(0, (playerHp / playerMaxHp) * 100);
            hpBarInner.style.width = `${hpPercent}%`;

            if (hpPercent > 50) {
                hpBarInner.style.backgroundColor = '#00ff66';
            } else if (hpPercent > 25) {
                hpBarInner.style.backgroundColor = '#ffcc00';
            } else {
                hpBarInner.style.backgroundColor = '#ff3333';
            }
        }

        // 觸發 Game Over 畫面
        function triggerGameOver() {
            isGameOver = true;
            clearInterval(alienAttackTimer);

            finalScore.innerText = `最終分數：${score}`;
            gameOverScreen.style.display = 'flex';
        }

        // 點擊「Defend Again」重置遊戲
        function resetGame() {
            bullets.forEach(b => b.element.remove());
            bullets.length = 0;

            alienBullets.forEach(b => b.element.remove());
            alienBullets.length = 0;

            score = 0;
            wave = 1;
            baseSpeed = 1.0;
            alienSpeed = baseSpeed;
            alienDirection = Math.random() < 0.5 ? 1 : -1;

            scoreDisplay.innerText = `Score: ${score}`;
            waveDisplay.innerText = `Wave: ${wave}`;

            playerHp = playerMaxHp;
            rocketX = (containerWidth - rocketWidth) / 2;
            rocket.style.left = rocketX + 'px';
            updateHpBar();

            gameOverScreen.style.display = 'none';
            isGameOver = false;

            createAliens();
            startAlienAttackTimer();
            requestAnimationFrame(gameLoop);
        }

        // 普通爆炸特效
        function createExplosion(x, y) {
            const explosionEl = document.createElement('div');
            explosionEl.className = 'explosion';
            explosionEl.innerText = '💥';
            explosionEl.style.left = x + 'px';
            explosionEl.style.top = y + 'px';
            container.appendChild(explosionEl);

            setTimeout(() => {
                explosionEl.remove();
            }, 300);
        }

        // 暴擊飄字特效 (CRIT!)
        function createCritText(x, y, damage) {
            const critEl = document.createElement('div');
            critEl.className = 'crit-text';
            critEl.innerText = `💥 CRIT! ${damage / 10000}萬`;
            critEl.style.left = (x - 20) + 'px';
            critEl.style.top = (y - 15) + 'px';
            container.appendChild(critEl);

            setTimeout(() => {
                critEl.remove();
            }, 500);
        }

        // 進入下一波次
        function startNextWave() {
            wave++;
            waveDisplay.innerText = `Wave: ${wave}`;

            baseSpeed += 0.5;
            alienSpeed = baseSpeed;
            alienDirection = Math.random() < 0.5 ? 1 : -1;

            createAliens();
        }

        // 記錄鍵盤按壓狀態
        const keys = { a: false, d: false };

        // 發射子彈 (15% 機率暴擊)
        function createBullet() {
            const bulletX = rocketX + (rocketWidth / 2) - 2;
            const bulletY = containerHeight - 20 - rocketHeight;

            const isCrit = Math.random() < 0.15;
            const damage = isCrit ? baseBulletDamage * 2 : baseBulletDamage;

            const bulletElement = document.createElement('div');
            bulletElement.className = isCrit ? 'bullet-crit' : 'bullet';
            bulletElement.style.left = bulletX + 'px';
            bulletElement.style.top = bulletY + 'px';
            container.appendChild(bulletElement);

            bullets.push({
                x: bulletX,
                y: bulletY,
                width: isCrit ? 6 : 4,
                height: isCrit ? 18 : 14,
                damage: damage,
                isCrit: isCrit,
                element: bulletElement
            });
        }

        // 鍵盤事件監聽
        window.addEventListener('keydown', (e) => {
            if (e.key === 'a' || e.key === 'A') keys.a = true;
            if (e.key === 'd' || e.key === 'D') keys.d = true;

            if (e.code === 'Space' && canShoot && !isGameOver) {
                createBullet();
                canShoot = false;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'a' || e.key === 'A') keys.a = false;
            if (e.key === 'd' || e.key === 'D') keys.d = false;
            if (e.code === 'Space') canShoot = true;
        });

        // 遊戲主迴圈
        function gameLoop() {
            if (isGameOver) return;

            // 火箭控制
            if (keys.a) rocketX -= rocketSpeed;
            if (keys.d) rocketX += rocketSpeed;

            if (rocketX < 0) rocketX = 0;
            if (rocketX > containerWidth - rocketWidth) rocketX = containerWidth - rocketWidth;

            rocket.style.left = rocketX + 'px';

            const rocketY = containerHeight - 20 - rocketHeight;

            // --- 1. 更新玩家子彈位置與碰撞 ---
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.y -= bulletSpeed;

                let bulletHit = false;

                for (let j = aliens.length - 1; j >= 0; j--) {
                    const alien = aliens[j];

                    if (
                        bullet.x < alien.x + 32 &&
                        bullet.x + bullet.width > alien.x &&
                        bullet.y < alien.y + 32 &&
                        bullet.y + bullet.height > alien.y
                    ) {
                        bulletHit = true;
                        alien.hp -= bullet.damage;

                        if (bullet.isCrit) {
                            createCritText(alien.x, alien.y, bullet.damage);
                        }

                        if (alien.hp <= 0) {
                            createExplosion(alien.x, alien.y);
                            alien.element.remove();
                            aliens.splice(j, 1);

                            score += 10;
                            scoreDisplay.innerText = `Score: ${score}`;
                        } else {
                            createExplosion(bullet.x - 10, bullet.y - 10);
                        }

                        break;
                    }
                }

                if (bulletHit || bullet.y < -18) {
                    bullet.element.remove();
                    bullets.splice(i, 1);
                } else {
                    bullet.element.style.top = bullet.y + 'px';
                }
            }

            // --- 2. 更新外星人子彈位置與碰撞 ---
            for (let i = alienBullets.length - 1; i >= 0; i--) {
                const ab = alienBullets[i];
                ab.y += alienBulletSpeed;

                if (
                    ab.x < rocketX + rocketWidth &&
                    ab.x + ab.width > rocketX &&
                    ab.y < rocketY + rocketHeight &&
                    ab.y + ab.height > rocketY
                ) {
                    playerHp -= ab.damage;
                    updateHpBar();
                    createExplosion(ab.x - 10, ab.y - 10);

                    ab.element.remove();
                    alienBullets.splice(i, 1);

                    if (playerHp <= 0) {
                        triggerGameOver();
                        return;
                    }
                    continue;
                }

                if (ab.y > containerHeight) {
                    ab.element.remove();
                    alienBullets.splice(i, 1);
                } else {
                    ab.element.style.top = ab.y + 'px';
                }
            }

            // --- 3. 外星人移動與邊界/底線判定 ---
            if (aliens.length > 0) {
                let touchEdge = false;
                let reachedBottom = false;

                for (let i = 0; i < aliens.length; i++) {
                    const alien = aliens[i];
                    const nextX = alien.x + (alienSpeed * alienDirection);

                    if (nextX <= 0 || nextX >= containerWidth - 32) {
                        touchEdge = true;
                    }

                    if (alien.y + 32 >= rocketY) {
                        reachedBottom = true;
                        break;
                    }
                }

                if (reachedBottom) {
                    triggerGameOver();
                    return;
                }

                if (touchEdge) {
                    alienDirection *= -1;
                    alienSpeed += speedAcceleration;

                    for (let i = 0; i < aliens.length; i++) {
                        const alien = aliens[i];
                        alien.y += dropDistance;
                        alien.element.style.top = alien.y + 'px';
                    }
                } else {
                    for (let i = 0; i < aliens.length; i++) {
                        const alien = aliens[i];
                        alien.x += alienSpeed * alienDirection;
                        alien.element.style.left = alien.x + 'px';
                    }
                }
            } else {
                startNextWave();
            }

            requestAnimationFrame(gameLoop);
        }

        // 初始化遊戲
        createAliens();
        startAlienAttackTimer();
        gameLoop();
    </script>
</body>
</html>
