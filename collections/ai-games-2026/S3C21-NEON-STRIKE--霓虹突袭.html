<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON STRIKE — 霓虹突袭</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#04060f; font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  #wrap { position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; touch-action:none; }

  /* ---------- HUD ---------- */
  #hud { position:absolute; inset:0; pointer-events:none; color:#e8f4ff; }
  .hud-top { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; padding:14px 18px; font-size:13px; letter-spacing:2px; }
  .stat { text-shadow:0 0 8px currentColor; }
  .k-score { color:#5ef1ff; }
  .k-hi    { color:#b47cff; }
  .k-lv    { color:#ffd166; }

  /* 生命 */
  #lives { position:absolute; bottom:16px; left:18px; display:flex; gap:8px; }
  .heart { width:16px; height:16px; background:#ff4d8d; clip-path:polygon(50% 100%,0 35%,0 15%,20% 0,50% 22%,80% 0,100% 15%,100% 35%); filter:drop-shadow(0 0 6px #ff4d8d); transition:opacity .25s, transform .25s; }
  .heart.off { opacity:.18; transform:scale(.8); filter:none; }

  /* 能量条 */
  #energyWrap { position:absolute; bottom:20px; right:18px; width:150px; }
  #energyLabel { font-size:10px; letter-spacing:3px; color:#8ac7ff; margin-bottom:5px; text-align:right; }
  #energyBar { height:8px; background:rgba(120,200,255,.13); border:1px solid rgba(120,200,255,.3); border-radius:5px; overflow:hidden; }
  #energyFill { height:100%; width:0%; background:linear-gradient(90deg,#5ef1ff,#b47cff); box-shadow:0 0 12px #5ef1ff; transition:width .12s linear; }
  #energyWrap.ready #energyLabel { color:#7dffb0; }
  #energyWrap.ready #energyFill { background:linear-gradient(90deg,#7dffb0,#5ef1ff); box-shadow:0 0 16px #7dffb0; }

  /* ---------- 遮罩层 ---------- */
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             background:radial-gradient(ellipse at 50% 42%,rgba(35,20,80,.72),rgba(4,6,15,.95)); backdrop-filter:blur(3px); z-index:10; }
  .overlay.hide { display:none; }
  .title { font-size:clamp(34px,8vw,64px); font-weight:800; letter-spacing:8px; color:#fff;
           text-shadow:0 0 10px #5ef1ff,0 0 32px #5ef1ff,0 0 64px #2f7bff; animation:pulse 2.6s ease-in-out infinite; }
  .sub { margin-top:6px; font-size:clamp(10px,2.6vw,13px); letter-spacing:6px; color:#8ac7ff; opacity:.85; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.72} }

  .btn { margin-top:30px; padding:13px 44px; font-size:15px; font-weight:700; letter-spacing:4px; color:#04060f; cursor:pointer;
         background:linear-gradient(90deg,#5ef1ff,#9d7bff); border:none; border-radius:40px;
         box-shadow:0 0 24px rgba(94,241,255,.55); transition:transform .15s, box-shadow .15s; font-family:inherit; }
  .btn:hover { transform:translateY(-2px); box-shadow:0 0 36px rgba(94,241,255,.8); }
  .btn:active { transform:translateY(0) scale(.97); }

  .tips { margin-top:26px; font-size:12px; line-height:2; color:#9fb4d6; text-align:center; }
  .key { display:inline-block; min-width:22px; padding:1px 7px; margin:0 3px; border:1px solid rgba(140,190,255,.4); border-radius:5px;
         background:rgba(120,180,255,.09); color:#cfe6ff; font-size:11px; }

  .final { margin-top:18px; display:flex; gap:38px; }
  .final .cell { text-align:center; }
  .final .num { font-size:clamp(26px,6vw,40px); font-weight:800; color:#5ef1ff; text-shadow:0 0 16px #5ef1ff; }
  .final .lbl { font-size:10px; letter-spacing:3px; color:#8ac7ff; margin-top:4px; }
  .newrec { margin-top:14px; font-size:13px; letter-spacing:4px; color:#ffd166; text-shadow:0 0 14px #ffd166; }
  .newrec.hide { display:none; }

  #pauseBtn { position:absolute; top:12px; left:50%; transform:translateX(-50%); pointer-events:auto;
              width:34px; height:34px; border-radius:50%; border:1px solid rgba(120,200,255,.35); background:rgba(10,20,45,.6);
              color:#8ac7ff; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  #pauseBtn:hover { color:#5ef1ff; border-color:#5ef1ff; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-top">
      <div class="stat k-score">SCORE <span id="score">0</span></div>
      <div class="stat k-hi">HI <span id="hi">0</span></div>
      <div class="stat k-lv">LV <span id="lv">1</span></div>
    </div>
    <button id="pauseBtn" title="暂停">❚❚</button>
    <div id="lives"></div>
    <div id="energyWrap">
      <div id="energyLabel">ENERGY</div>
      <div id="energyBar"><div id="energyFill"></div></div>
    </div>
  </div>

  <!-- 开始界面 -->
  <div class="overlay" id="startScreen">
    <div class="title">NEON STRIKE</div>
    <div class="sub">霓 虹 突 袭</div>
    <button class="btn" id="startBtn">开 始 游 戏</button>
    <div class="tips">
      <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> / <span class="key">↑</span><span class="key">↓</span><span class="key">←</span><span class="key">→</span> 移动 &nbsp;·&nbsp; 移动端直接拖拽<br>
      自动射击 &nbsp;·&nbsp; <span class="key">空格</span> 释放 EMP 风暴（需能量满）<br>
      <span class="key">P</span> 暂停
    </div>
  </div>

  <!-- 结束界面 -->
  <div class="overlay hide" id="overScreen">
    <div class="title" style="font-size:clamp(26px,6vw,46px);text-shadow:0 0 10px #ff4d8d,0 0 32px #ff4d8d;">GAME OVER</div>
    <div class="final">
      <div class="cell"><div class="num" id="fScore">0</div><div class="lbl">SCORE</div></div>
      <div class="cell"><div class="num" id="fLevel">1</div><div class="lbl">LEVEL</div></div>
    </div>
    <div class="newrec hide" id="newRec">★ 新 纪 录 ★</div>
    <button class="btn" id="againBtn">再 来 一 局</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ======================= 基础设置 ======================= */
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');

// 逻辑分辨率（竖版 9:16），按窗口自适应缩放
const VW = 480, VH = 854;
let scale = 1, offX = 0, offY = 0;

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width  = Math.floor(w * dpr);
  cvs.height = Math.floor(h * dpr);
  cvs.style.width = w + 'px';
  cvs.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  scale = Math.min(w / VW, h / VH);
  offX = (w - VW * scale) / 2;
  offY = (h - VH * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

/* ======================= 工具函数 ======================= */
const rand  = (a, b) => a + Math.random() * (b - a);
const randI = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist2 = (a, b) => { const dx = a.x - b.x, dy = a.y - b.y; return dx*dx + dy*dy; };
const TAU = Math.PI * 2;

/* ======================= 音效（WebAudio 合成） ======================= */
const Sound = (() => {
  let ac = null, enabled = true;
  function ensure(){
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ enabled = false; } }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, dur, type, vol, sweep){
    if (!enabled || !ensure()) return;
    const t = ac.currentTime;
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t);
    if (sweep) osc.frequency.exponentialRampToValueAtTime(Math.max(30, sweep), t + dur);
    g.gain.setValueAtTime(vol || .05, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    osc.connect(g); g.connect(ac.destination);
    osc.start(t); osc.stop(t + dur + .02);
  }
  function noise(dur, vol, filterFreq){
    if (!enabled || !ensure()) return;
    const t = ac.currentTime, len = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filterFreq || 1400;
    const g = ac.createGain(); g.gain.value = vol || .12;
    src.connect(f); f.connect(g); g.connect(ac.destination);
    src.start(t);
  }
  return {
    init: ensure,
    shoot: () => tone(760, .06, 'square', .022, 280),
    hit:   () => tone(220, .05, 'sawtooth', .03, 120),
    kill:  () => { noise(.16, .09, 1800); tone(140, .16, 'sawtooth', .04, 60); },
    bigKill: () => { noise(.4, .18, 900); tone(90, .45, 'sawtooth', .07, 35); },
    pick:  () => { tone(880, .09, 'sine', .06); setTimeout(()=>tone(1320,.11,'sine',.06), 80); },
    hurt:  () => { noise(.3, .2, 700); tone(180, .3, 'square', .06, 50); },
    bomb:  () => { noise(.7, .25, 2600); tone(120, .8, 'sine', .1, 40); },
    ready: () => { tone(660,.08,'sine',.05); setTimeout(()=>tone(990,.14,'sine',.05),90); }
  };
})();

/* ======================= 全局状态 ======================= */
const STATE = { START:'start', PLAY:'play', PAUSE:'pause', OVER:'over' };
let state = STATE.START;

const game = {
  score: 0, hi: +(localStorage.getItem('neonStrikeHi') || 0),
  level: 1, lives: 3, energy: 0, empReady: false,
  time: 0, shake: 0, hitFlash: 0, comboTimer: 0, combo: 0
};

/* ======================= 输入 ======================= */
const keys = Object.create(null);
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
  keys[k] = true;
  if (e.key === ' ' && state === STATE.PLAY) useEmp();
  if (k === 'p') { if (state === STATE.PLAY) pause(); else if (state === STATE.PAUSE) resume(); }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// 触摸 / 鼠标拖拽
let pointer = { active:false, x:0, y:0, id:null };
function toLogical(cx, cy){
  return { x: (cx - offX) / scale, y: (cy - offY) / scale };
}
cvs.addEventListener('pointerdown', e => {
  if (state !== STATE.PLAY) return;
  const p = toLogical(e.clientX, e.clientY);
  pointer.active = true; pointer.x = p.x; pointer.y = p.y; pointer.id = e.pointerId;
  cvs.setPointerCapture(e.pointerId);
});
cvs.addEventListener('pointermove', e => {
  if (!pointer.active || e.pointerId !== pointer.id) return;
  const p = toLogical(e.clientX, e.clientY);
  pointer.x = p.x; pointer.y = p.y;
});
const endPointer = e => { if (e.pointerId === pointer.id) pointer.active = false; };
cvs.addEventListener('pointerup', endPointer);
cvs.addEventListener('pointercancel', endPointer);

/* ======================= 实体 ======================= */
const bullets    = [];  // 玩家子弹
const eBullets   = [];  // 敌方子弹
const enemies    = [];
const particles  = [];
const powerups   = [];
const floaters   = [];  // 飘字
const stars      = [];

// 星空背景
for (let i = 0; i < 110; i++){
  stars.push({ x: rand(0,VW), y: rand(0,VH), r: rand(.4,1.8), v: rand(14,70), hue: Math.random() < .75 ? 195 : 275 });
}

const player = {
  x: VW/2, y: VH - 130, r: 13,
  vx: 0, vy: 0, speed: 0.62, cool: 0, invul: 0,
  fireLevel: 1, rapid: 0, shield: 0, droneSide: 0
};

/* ======================= 粒子 / 飘字 ======================= */
function spawnParticles(x, y, count, color, speed, life, size){
  for (let i = 0; i < count; i++){
    const a = rand(0, TAU), s = rand(speed*.35, speed);
    particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: rand(life*.55, life), maxLife: life,
      color, size: rand(size*.5, size)
    });
  }
}
function floatText(x, y, text, color, size){
  floaters.push({ x, y, text, color, size: size || 14, life: 1 });
}

/* ======================= 生成器 ======================= */
const ENEMY_TYPES = {
  scout: { r:14, hp:1, score:10, color:'#5ef1ff', speed:1.5, fire:0 },
  fighter:{ r:19, hp:3, score:25, color:'#b47cff', speed:1.1, fire:2.4 },
  tank:  { r:28, hp:9, score:60, color:'#ff7a45', speed:.65, fire:3.2 },
  darter:{ r:15, hp:2, score:20, color:'#ffd166', speed:2.4, fire:0 }
};

function spawnEnemy(){
  const lv = game.level;
  const roll = Math.random();
  let type = 'scout';
  const tW = Math.min(.5 + lv*.012, .72);          // tank 权重
  const fW = Math.min(.28 + lv*.01, .42);          // fighter
  const dW = lv >= 3 ? .22 : 0;                    // darter
  if (roll < tW) type = 'tank';
  else if (roll < tW + fW) type = 'fighter';
  else if (roll < tW + fW + dW) type = 'darter';

  const t = ENEMY_TYPES[type];
  const r = t.r;
  const e = {
    type, x: rand(r + 18, VW - r - 18), y: -r - 10,
    r, hp: Math.round(t.hp * (1 + (lv-1)*.22)), maxHp: 0,
    color: t.color, score: t.score,
    vy: t.speed * (1 + (lv-1)*.055), vx: 0,
    fireCd: t.fire ? rand(.8, t.fire) : 0, fireRate: t.fire,
    phase: rand(0, TAU), hit: 0, wobble: rand(.6,1.6)
  };
  e.maxHp = e.hp;
  if (type === 'darter'){ e.vx = (Math.random() < .5 ? -1 : 1) * rand(1.2, 2.4); }
  if (type === 'fighter' && Math.random() < .4) e.zig = true;
  enemies.push(e);
}

function spawnFormation(){
  // 编队刷怪：一横排 scout
  const n = randI(4, 6);
  const startX = rand(70, VW - 70 - (n-1)*52);
  const y = -30;
  for (let i = 0; i < n; i++){
    const t = ENEMY_TYPES.scout;
    enemies.push({
      type:'scout', x: startX + i*52, y: y - Math.abs(i - (n-1)/2)*16,
      r: t.r, hp: 1 + Math.floor(game.level/5), maxHp: 1 + Math.floor(game.level/5),
      color: t.color, score: t.score + 5, vy: 1.9 + game.level*.05, vx: 0,
      fireCd: 0, fireRate: 0, phase: rand(0,TAU), hit: 0, wobble: 1.2
    });
  }
}

function spawnBoss(){
  const lv = game.level;
  const e = {
    type:'boss', x: VW/2, y: -90, r: 56,
    hp: Math.round(120 + lv*45), maxHp: 0,
    color:'#ff4d8d', score: 600 + lv*180,
    vy: 1.0, vx: 1.4, entering: true,
    fireCd: 2, pattern: 0, patternT: 0, hit: 0, wobble: 0
  };
  e.maxHp = e.hp;
  enemies.push(e);
  Sound.bigKill();
  floatText(VW/2, 140, '⚠ BOSS 来袭 ⚠', '#ff4d8d', 20);
}

/* ======================= 射击 ======================= */
function playerShoot(){
  const p = player;
  const lvl = p.fireLevel;
  const bs = -9.5;                       // 子弹速度（向上）
  const mk = (dx, dy, offX, dmg, big) => bullets.push({
    x: p.x + offX, y: p.y - 14, vx: dx, vy: dy,
    r: big ? 5 : 3.2, dmg: dmg, big: !!big, life: 1
  });

  if (lvl === 1){
    mk(0, bs, 0, 1);
  } else if (lvl === 2){
    mk(0, bs, -7, 1); mk(0, bs, 7, 1);
  } else if (lvl === 3){
    mk(0, bs, 0, 2, true); mk(-1.1, bs, -9, 1); mk(1.1, bs, 9, 1);
  } else {
    mk(0, bs, 0, 2, true); mk(-1.2, bs, -9, 1); mk(1.2, bs, 9, 1);
    mk(-2.6, bs*.86, -15, 1); mk(2.6, bs*.86, 15, 1);
  }
  Sound.shoot();
}

function enemyShoot(e){
  const speed = 3.1 + game.level*.12;
  if (e.type === 'boss'){
    const pat = e.pattern % 3;
    if (pat === 0){                        // 扇形弹幕
      const n = 9;
      for (let i = 0; i < n; i++){
        const a = Math.PI/2 + (i - (n-1)/2) * 0.19;
        eBullets.push({ x:e.x, y:e.y+e.r*.6, vx:Math.cos(a)*speed, vy:Math.sin(a)*speed, r:5, color:'#ff4d8d', dmg:1 });
      }
    } else if (pat === 1){                 // 瞄准三连
      const a = Math.atan2(player.y - e.y, player.x - e.x);
      for (let i = -1; i <= 1; i++){
        eBullets.push({ x:e.x, y:e.y, vx:Math.cos(a + i*.16)*speed*1.15, vy:Math.sin(a + i*.16)*speed*1.15, r:5, color:'#ffd166', dmg:1 });
      }
    } else {                               // 旋转弹
      for (let i = 0; i < 14; i++){
        const a = e.patternT * 1.5 + i * (TAU/14);
        eBullets.push({ x:e.x, y:e.y, vx:Math.cos(a)*speed*.85, vy:Math.sin(a)*speed*.85, r:4.5, color:'#b47cff', dmg:1 });
      }
    }
    return;
  }
  if (e.type === 'fighter'){
    const a = Math.atan2(player.y - e.y, player.x - e.x);
    for (let i = -1; i <= 1; i++){
      eBullets.push({ x:e.x, y:e.y+e.r*.5, vx:Math.cos(a+i*.13)*speed*.9, vy:Math.sin(a+i*.13)*speed*.9, r:4, color:'#b47cff', dmg:1 });
    }
  } else if (e.type === 'tank'){
    const a = Math.atan2(player.y - e.y, player.x - e.x);
    for (let i = -1; i <= 1; i++){
      eBullets.push({ x:e.x, y:e.y+e.r*.4, vx:Math.cos(a+i*.2)*speed*.8, vy:Math.sin(a+i*.2)*speed*.8, r:5.5, color:'#ff7a45', dmg:1 });
    }
  }
}

/* ======================= EMP 风暴 ======================= */
function useEmp(){
  if (!game.empReady) return;
  game.empReady = false;
  game.energy = 0;
  game.shake = 22;
  Sound.bomb();
  // 清屏
  for (let i = eBullets.length - 1; i >= 0; i--){
    spawnParticles(eBullets[i].x, eBullets[i].y, 2, '#7dffb0', 90, .4, 3);
    eBullets.splice(i, 1);
  }
  for (const e of enemies){
    e.hp -= 6;
    e.hit = .25;
    spawnParticles(e.x, e.y, 6, '#7dffb0', 180, .5, 3);
  }
  // 冲击波粒子
  spawnParticles(player.x, player.y, 70, '#7dffb0', 420, .9, 5);
  spawnParticles(player.x, player.y, 40, '#5ef1ff', 300, .7, 4);
  floatText(player.x, player.y - 60, 'EMP!', '#7dffb0', 26);
  // 摧毁判定
  for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].hp <= 0) destroyEnemy(enemies[i], i);
}

/* ======================= 伤害 / 死亡 ======================= */
function damagePlayer(){
  if (player.invul > 0) return;
  if (player.shield > 0){
    player.shield = 0;
    player.invul = 1.1;
    Sound.hit();
    spawnParticles(player.x, player.y, 24, '#5ef1ff', 260, .6, 4);
    floatText(player.x, player.y - 40, '护盾破碎', '#5ef1ff', 14);
    return;
  }
  game.lives--;
  player.invul = 2.0;
  game.shake = 16;
  game.hitFlash = .55;
  game.combo = 0;
  Sound.hurt();
  spawnParticles(player.x, player.y, 40, '#ff4d8d', 320, .9, 5);
  player.fireLevel = Math.max(1, player.fireLevel - 1);
  updateHUD();
  if (game.lives <= 0) gameOver();
}

function destroyEnemy(e, idx){
  const isBoss = e.type === 'boss';
  Sound[isBoss ? 'bigKill' : 'kill']();

  // 连击
  game.combo++; game.comboTimer = 2.2;
  const mult = 1 + Math.min(game.combo, 20) * 0.05;
  const gain = Math.round(e.score * mult);
  game.score += gain;
  floatText(e.x, e.y, '+' + gain, isBoss ? '#ff4d8d' : '#5ef1ff', isBoss ? 22 : 13);

  // 粒子
  spawnParticles(e.x, e.y, isBoss ? 80 : (e.type === 'tank' ? 26 : 16),
                 e.color, isBoss ? 420 : 240, isBoss ? 1.2 : .65, isBoss ? 6 : 4);
  if (isBoss){
    // 多色爆炸
    spawnParticles(e.x, e.y, 50, '#ffd166', 360, 1.0, 5);
    spawnParticles(e.x, e.y, 50, '#5ef1ff', 320, 1.1, 5);
    game.shake = 24;
    // 能量大补
    addEnergy(40);
  }

  // 掉落
  const dropChance = isBoss ? 1 : (e.type === 'tank' ? .5 : e.type === 'fighter' ? .22 : .07);
  if (Math.random() < dropChance) spawnPowerup(e.x, e.y, isBoss);

  enemies.splice(idx, 1);
  addEnergy(isBoss ? 8 : 1.6);
  game.energy = clamp(game.energy, 0, 100);
  updateHUD();
}

function spawnPowerup(x, y, boss){
  const pool = [
    { k:'power',  color:'#ffd166', icon:'★', w: 34 },   // 火力
    { k:'rapid',  color:'#7dffb0', icon:'⚡', w: 22 },  // 急速
    { k:'shield', color:'#5ef1ff', icon:'◈', w: 24 },   // 护盾
    { k:'life',   color:'#ff4d8d', icon:'♥', w: 8 },    // 生命
    { k:'bomb',   color:'#b47cff', icon:'✦', w: 12 }    // 能量
  ];
  let total = pool.reduce((s,p) => s + p.w, 0);
  let r = Math.random() * total, pick = pool[0];
  for (const p of pool){ if (r < p.w){ pick = p; break; } r -= p.w; }
  powerups.push({ x, y, vy: 1.6, r: 13, k: pick.k, color: pick.color, icon: pick.icon, life: 1, boss });
}

function applyPowerup(p){
  Sound.pick();
  switch (p.k){
    case 'power':
      player.fireLevel = Math.min(4, player.fireLevel + 1);
      floatText(player.x, player.y - 44, '火力 ' + player.fireLevel, '#ffd166', 16);
      break;
    case 'rapid':
      player.rapid = Math.min(12, player.rapid + 7);
      floatText(player.x, player.y - 44, '急速射击', '#7dffb0', 16);
      break;
    case 'shield':
      player.shield = 1;
      floatText(player.x, player.y - 44, '护盾启动', '#5ef1ff', 16);
      break;
    case 'life':
      game.lives = Math.min(5, game.lives + 1);
      floatText(player.x, player.y - 44, '+1 生命', '#ff4d8d', 16);
      break;
    case 'bomb':
      addEnergy(35);
      floatText(player.x, player.y - 44, '能量 +35', '#b47cff', 16);
      break;
  }
  updateHUD();
}

function addEnergy(v){
  const was = game.empReady;
  game.energy = clamp(game.energy + v, 0, 100);
  if (game.energy >= 100 && !was){
    game.empReady = true;
    Sound.ready();
    floatText(player.x, player.y - 70, 'EMP 就绪 (空格)', '#7dffb0', 15);
  }
}

/* ======================= 更新 ======================= */
let shootTimer = 0;

function update(dt){
  game.time += dt;

  // ---- 星空 ----
  for (const s of stars){
    s.y += s.v * dt * (1 + game.level * .03);
    if (s.y > VH){ s.y = -2; s.x = rand(0, VW); }
  }

  // ---- 玩家移动 ----
  const p = player;
  let mx = 0, my = 0;
  if (keys['a'] || keys['arrowleft'])  mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  if (keys['w'] || keys['arrowup'])    my -= 1;
  if (keys['s'] || keys['arrowdown'])  my += 1;

  if (mx || my){
    const len = Math.hypot(mx, my);
    p.x += (mx / len) * p.speed * 380 * dt;
    p.y += (my / len) * p.speed * 380 * dt;
  }
  // 拖拽跟随（指针优先）
  if (pointer.active){
    const tx = pointer.x, ty = pointer.y - 26;
    const lerp = 1 - Math.pow(.0015, dt);
    p.x += (tx - p.x) * lerp;
    p.y += (ty - p.y) * lerp;
  }

  p.x = clamp(p.x, p.r + 6, VW - p.r - 6);
  p.y = clamp(p.y, p.r + 6, VH - p.r - 6);
  if (p.invul > 0) p.invul -= dt;
  if (p.rapid > 0) p.rapid -= dt;

  // ---- 自动射击 ----
  shootTimer -= dt;
  const interval = p.rapid > 0 ? .075 : .135;
  if (shootTimer <= 0){ playerShoot(); shootTimer = interval; }

  // ---- 刷怪 ----
  spawnTimer -= dt;
  if (spawnTimer <= 0 && !bossActive()){
    if (Math.random() < .28) spawnFormation();
    else spawnEnemy();
    spawnTimer = Math.max(.24, 1.05 - game.level * .045) * rand(.75, 1.25);
  }

  // ---- 升级 ----
  const wantLevel = 1 + Math.floor(game.score / 1100);
  if (wantLevel > game.level){
    game.level = wantLevel;
    floatText(VW/2, VH/2 - 40, 'LEVEL ' + game.level, '#ffd166', 26);
    updateHUD();
    if (game.level % 3 === 0) setTimeout(() => { if (state === STATE.PLAY) spawnBoss(); }, 400);
  }

  // ---- 敌人 ----
  for (let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i];
    if (e.hit > 0) e.hit -= dt;

    if (e.type === 'boss'){
      if (e.entering){
        e.y += 70 * dt;
        if (e.y >= 120) { e.entering = false; }
      } else {
        e.x += e.vx * 90 * dt;
        if (e.x < e.r + 20) { e.x = e.r + 20; e.vx *= -1; }
        if (e.x > VW - e.r - 20) { e.x = VW - e.r - 20; e.vx *= -1; }
        e.y = 120 + Math.sin(game.time * 1.3) * 22;
        e.patternT += dt;
        e.fireCd -= dt;
        if (e.fireCd <= 0){
          enemyShoot(e);
          e.pattern++;
          const bpm = Math.max(.75, 1.7 - game.level * .04);
          e.fireCd = bpm + (e.pattern % 2 ? .45 : 0);
        }
      }
    } else {
      e.y += e.vy * 60 * dt;
      if (e.type === 'darter'){
        e.x += e.vx * 60 * dt;
        if (e.x < e.r) { e.x = e.r; e.vx *= -1; }
        if (e.x > VW - e.r) { e.x = VW - e.r; e.vx *= -1; }
      } else if (e.type === 'fighter' && e.zig){
        e.x += Math.sin(game.time * 2.4 + e.phase) * e.wobble * 55 * dt;
        e.x = clamp(e.x, e.r, VW - e.r);
      } else {
        e.x += Math.sin(game.time * 1.3 + e.phase) * .35 * 60 * dt;
        e.x = clamp(e.x, e.r, VW - e.r);
      }
      // 开火
      if (e.fireRate > 0){
        e.fireCd -= dt;
        if (e.fireCd <= 0 && e.y > 0 && e.y < VH * .78){
          enemyShoot(e);
          e.fireCd = Math.max(.7, e.fireRate - game.level * .09) * rand(.85, 1.2);
        }
      }
    }

    if (e.y > VH + 90){ enemies.splice(i, 1); continue; }

    // 撞玩家
    if (p.invul <= 0 && dist2(e, p) < (e.r + p.r) * (e.r + p.r)){
      const isBoss = e.type === 'boss';
      damagePlayer();
      if (!isBoss){ spawnParticles(e.x, e.y, 14, e.color, 200, .5, 4); enemies.splice(i, 1); }
    }
  }

  // ---- 玩家子弹 ----
  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.x += b.vx * 60 * dt;
    b.y += b.vy * 60 * dt;
    if (b.y < -20 || b.x < -20 || b.x > VW + 20){ bullets.splice(i, 1); continue; }
    for (let j = enemies.length - 1; j >= 0; j--){
      const e = enemies[j];
      if (e.entering) continue;
      if (dist2(b, e) < (e.r + b.r) * (e.r + b.r)){
        e.hp -= b.dmg;
        e.hit = .12;
        spawnParticles(b.x, b.y, 3, e.color, 120, .3, 2.6);
        Sound.hit();
        bullets.splice(i, 1);
        if (e.hp <= 0) destroyEnemy(e, j);
        break;
      }
    }
  }

  // ---- 敌方子弹 ----
  for (let i = eBullets.length - 1; i >= 0; i--){
    const b = eBullets[i];
    b.x += b.vx * 60 * dt;
    b.y += b.vy * 60 * dt;
    if (b.y > VH + 30 || b.y < -30 || b.x < -30 || b.x > VW + 30){ eBullets.splice(i, 1); continue; }
    if (p.invul <= 0 && dist2(b, p) < (p.r*.82 + b.r) * (p.r*.82 + b.r)){
      spawnParticles(b.x, b.y, 8, b.color, 160, .4, 3);
      eBullets.splice(i, 1);
      damagePlayer();
    }
  }

  // ---- 道具 ----
  for (let i = powerups.length - 1; i >= 0; i--){
    const u = powerups[i];
    u.y += u.vy * 60 * dt;
    u.life = Math.max(0, u.life - dt * .12);
    if (u.y > VH + 30){ powerups.splice(i, 1); continue; }
    // 磁吸（靠近时加速)
    if (dist2(u, p) < 110*110){
      const a = Math.atan2(p.y - u.y, p.x - u.x);
      u.x += Math.cos(a) * 200 * dt;
      u.y += Math.sin(a) * 200 * dt;
    }
    if (dist2(u, p) < (u.r + p.r + 4) * (u.r + p.r + 4)){
      applyPowerup(u);
      powerups.splice(i, 1);
    }
  }

  // ---- 粒子 ----
  for (let i = particles.length - 1; i >= 0; i--){
    const q = particles[i];
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vx *= .955; q.vy *= .955;
    q.vy += 26 * dt;
    q.life -= dt;
    if (q.life <= 0) particles.splice(i, 1);
  }

  // ---- 飘字 ----
  for (let i = floaters.length - 1; i >= 0; i--){
    const f = floaters[i];
    f.y -= 42 * dt;
    f.life -= dt * 1.15;
    if (f.life <= 0) floaters.splice(i, 1);
  }

  // ---- 其它 ----
  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 55);
  if (game.hitFlash > 0) game.hitFlash = Math.max(0, game.hitFlash - dt * 1.8);
  if (game.comboTimer > 0){ game.comboTimer -= dt; if (game.comboTimer <= 0) game.combo = 0; }

  // 能量缓慢自然增长
  if (!game.empReady) addEnergy(dt * 1.6);
  updateHUD();
}

function bossActive(){ return enemies.some(e => e.type === 'boss'); }

/* ======================= 渲染 ======================= */
function draw(){
  const w = window.innerWidth, h = window.innerHeight;
  ctx.clearRect(0, 0, w, h);

  // 棋盘外面（letterbox）用深色填充
  ctx.save();
  ctx.fillStyle = '#04060f';
  ctx.fillRect(0, 0, w, h);

  // 屏幕震动
  let sx = 0, sy = 0;
  if (game.shake > 0){ sx = rand(-game.shake, game.shake) * .5; sy = rand(-game.shake, game.shake) * .5; }

  ctx.translate(offX + sx, offY + sy);
  ctx.scale(scale, scale);

  // 游戏区域裁剪
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();

  drawBackground();
  drawGrid();
  drawStars();

  // 道具
  for (const u of powerups) drawPowerup(u);
  // 粒子（底层）
  drawParticles();
  // 敌人
  for (const e of enemies) drawEnemy(e);
  // 敌方子弹
  for (const b of eBullets) drawEBullet(b);
  // 玩家子弹
  for (const b of bullets) drawBullet(b);
  // 玩家
  if (state !== STATE.OVER || game.lives > 0) drawPlayer();
  // 飘字
  drawFloaters();

  // 受击闪红
  if (game.hitFlash > 0){
    ctx.fillStyle = 'rgba(255,60,120,' + (game.hitFlash * .45) + ')';
    ctx.fillRect(0, 0, VW, VH);
  }
  // 边缘光晕
  drawVignette();

  ctx.restore(); // clip

  // 边框霓虹
  ctx.strokeStyle = 'rgba(94,241,255,.22)';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, VW - 2, VH - 2);

  ctx.restore();
}

function drawBackground(){
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#0a0f24');
  g.addColorStop(.55, '#070b1a');
  g.addColorStop(1, '#04060f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);
}

function drawGrid(){
  // 透视网格，营造纵深
  ctx.save();
  ctx.strokeStyle = 'rgba(94,241,255,.075)';
  ctx.lineWidth = 1;
  const scroll = (game.time * 60) % 60;
  for (let y = -60 + scroll; y < VH; y += 60){
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(VW, y); ctx.stroke();
  }
  for (let x = 0; x <= VW; x += 60){
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, VH); ctx.stroke();
  }
  ctx.restore();
}

function drawStars(){
  for (const s of stars){
    ctx.beginPath();
    ctx.fillStyle = 'hsla(' + s.hue + ',100%,75%,' + (0.25 + s.r / 2.4) + ')';
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
}

function glow(color, blur, fn){
  ctx.save();
  ctx.shadowColor = color; ctx.shadowBlur = blur;
  fn();
  ctx.restore();
}

function drawPlayer(){
  const p = player;
  // 无敌闪烁
  if (p.invul > 0 && Math.floor(p.invul * 12) % 2 === 0) return;

  ctx.save();
  ctx.translate(p.x, p.y);

  // 引擎火焰
  const fl = 12 + Math.sin(game.time * 40) * 5;
  const fg = ctx.createLinearGradient(0, 8, 0, 8 + fl + 8);
  fg.addColorStop(0, 'rgba(94,241,255,.95)');
  fg.addColorStop(.5, 'rgba(120,140,255,.55)');
  fg.addColorStop(1, 'rgba(120,80,255,0)');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(-6, 8); ctx.lineTo(6, 8); ctx.lineTo(0, 8 + fl + 8);
  ctx.closePath(); ctx.fill();

  // 机身
  glow('#5ef1ff', 18, () => {
    ctx.fillStyle = '#eafcff';
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(9, 6);
    ctx.lineTo(0, 2);
    ctx.lineTo(-9, 6);
    ctx.closePath(); ctx.fill();
    // 机翼
    ctx.fillStyle = '#5ef1ff';
    ctx.beginPath();
    ctx.moveTo(-9, 4); ctx.lineTo(-18, 12); ctx.lineTo(-4, 9); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(9, 4); ctx.lineTo(18, 12); ctx.lineTo(4, 9); ctx.closePath(); ctx.fill();
    // 驾驶舱
    ctx.fillStyle = '#b47cff';
    ctx.beginPath(); ctx.ellipse(0, -2, 3, 5, 0, 0, TAU); ctx.fill();
  });

  // 侧翼僚机
  if (p.fireLevel >= 3){
    const ox = 20;
    for (const s of [-1, 1]){
      glow('#b47cff', 10, () => {
        ctx.fillStyle = '#b47cff';
        ctx.beginPath();
        ctx.moveTo(s * ox, 2);
        ctx.lineTo(s * (ox + 7), 12);
        ctx.lineTo(s * (ox - 4), 11);
        ctx.closePath(); ctx.fill();
      });
    }
  }

  // 护盾
  if (p.shield > 0){
    ctx.save();
    ctx.strokeStyle = 'rgba(94,241,255,.85)';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#5ef1ff'; ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(0, 0, p.r + 12 + Math.sin(game.time * 6) * 2, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  ctx.restore();
}

function drawEnemy(e){
  ctx.save();
  ctx.translate(e.x, e.y);
  const hitC = e.hit > 0;
  const col = hitC ? '#ffffff' : e.color;

  if (e.type === 'boss'){
    glow(col, 26, () => {
      // 主体六边形
      ctx.fillStyle = 'rgba(20,8,32,.95)';
      ctx.strokeStyle = col; ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i = 0; i < 6; i++){
        const a = i * TAU/6 - Math.PI/2;
        const px = Math.cos(a) * e.r, py = Math.sin(a) * e.r;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // 内核
      const pulse = 0.6 + Math.sin(game.time * 5) * .4;
      ctx.fillStyle = 'rgba(255,77,141,' + (0.5 + pulse * .4) + ')';
      ctx.beginPath(); ctx.arc(0, 0, e.r * .42, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, 0, e.r * .18, 0, TAU); ctx.fill();
      // 环
      ctx.strokeStyle = 'rgba(255,209,102,.7)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, e.r * .68, game.time * 2, game.time * 2 + Math.PI * 1.2); ctx.stroke();
    });
  } else if (e.type === 'scout'){
    glow(col, 14, () => {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(0, e.r);
      ctx.lineTo(e.r * .85, -e.r * .55);
      ctx.lineTo(0, -e.r * .2);
      ctx.lineTo(-e.r * .85, -e.r * .55);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath(); ctx.arc(0, -e.r*.1, e.r*.22, 0, TAU); ctx.fill();
    });
  } else if (e.type === 'fighter'){
    glow(col, 16, () => {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(0, e.r * .95);
      ctx.lineTo(e.r, -e.r * .3);
      ctx.lineTo(e.r * .35, -e.r * .75);
      ctx.lineTo(-e.r * .35, -e.r * .75);
      ctx.lineTo(-e.r, -e.r * .3);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(10,10,30,.85)';
      ctx.beginPath(); ctx.ellipse(0, e.r*.15, e.r*.32, e.r*.42, 0, 0, TAU); ctx.fill();
    });
  } else if (e.type === 'tank'){
    glow(col, 20, () => {
      ctx.fillStyle = 'rgba(30,12,8,.92)';
      ctx.strokeStyle = col; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, e.r); ctx.lineTo(e.r, e.r*.25);
      ctx.lineTo(e.r*.72, -e.r*.72); ctx.lineTo(-e.r*.72, -e.r*.72);
      ctx.lineTo(-e.r, e.r*.25);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(0, 0, e.r * .3, 0, TAU); ctx.fill();
    });
  } else if (e.type === 'darter'){
    glow(col, 14, () => {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(0, e.r); ctx.lineTo(e.r*.6, 0); ctx.lineTo(0, -e.r); ctx.lineTo(-e.r*.6, 0);
      ctx.closePath(); ctx.fill();
    });
  }

  // 血条（血量 >1 或 boss）
  if (e.maxHp > 1){
    const bw = e.type === 'boss' ? 150 : e.r * 2.2;
    const bh = e.type === 'boss' ? 7 : 3;
    const by = e.type === 'boss' ? e.r + 14 : -e.r - 9;
    const ratio = clamp(e.hp / e.maxHp, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(-bw/2, by, bw, bh);
    const hg = ctx.createLinearGradient(-bw/2, 0, bw/2, 0);
    if (e.type === 'boss'){ hg.addColorStop(0,'#ff4d8d'); hg.addColorStop(1,'#ffd166'); }
    else { hg.addColorStop(0, col); hg.addColorStop(1, '#ffffff'); }
    ctx.fillStyle = hg;
    ctx.fillRect(-bw/2, by, bw * ratio, bh);
  }
  ctx.restore();
}

function drawBullet(b){
  const col = b.big ? '#ffd166' : '#5ef1ff';
  glow(col, b.big ? 16 : 10, () => {
    ctx.fillStyle = col;
    ctx.beginPath();
    if (b.big){
      ctx.ellipse(b.x, b.y, b.r, b.r * 2, 0, 0, TAU);
    } else {
      ctx.roundRect ? ctx.roundRect(b.x - b.r, b.y - b.r*2.2, b.r*2, b.r*4.4, b.r) : ctx.rect(b.x-b.r, b.y-b.r*2.2, b.r*2, b.r*4.4);
    }
    ctx.fill();
    // 拖尾
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.arc(b.x, b.y - b.r * 1.6, b.r * .5, 0, TAU); ctx.fill();
  });
}

function drawEBullet(b){
  glow(b.color, 12, () => {
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.arc(b.x - b.r*.25, b.y - b.r*.25, b.r*.4, 0, TAU); ctx.fill();
  });
}

function drawPowerup(u){
  ctx.save();
  ctx.translate(u.x, u.y);
  ctx.rotate(game.time * 1.6);
  glow(u.color, 18, () => {
    ctx.strokeStyle = u.color; ctx.lineWidth = 2;
    // 菱形外框
    ctx.beginPath();
    ctx.moveTo(0, -u.r); ctx.lineTo(u.r, 0); ctx.lineTo(0, u.r); ctx.lineTo(-u.r, 0);
    ctx.closePath(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fill();
  });
  ctx.rotate(-game.time * 1.6);
  ctx.fillStyle = u.color;
  ctx.font = 'bold 14px "Segoe UI",system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(u.icon, 0, 1);
  ctx.restore();
}

function drawParticles(){
  for (const q of particles){
    const a = clamp(q.life / q.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = q.color;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.size * a, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloaters(){
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floaters){
    ctx.globalAlpha = clamp(f.life, 0, 1);
    ctx.fillStyle = f.color;
    ctx.shadowColor = f.color; ctx.shadowBlur = 10;
    ctx.font = 'bold ' + f.size + 'px "Segoe UI",system-ui,sans-serif';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

function drawVignette(){
  const g = ctx.createRadialGradient(VW/2, VH/2, VH*.3, VW/2, VH/2, VH*.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);
}

/* ======================= HUD ======================= */
const el = {
  score: document.getElementById('score'),
  hi: document.getElementById('hi'),
  lv: document.getElementById('lv'),
  lives: document.getElementById('lives'),
  energyFill: document.getElementById('energyFill'),
  energyWrap: document.getElementById('energyWrap'),
  start: document.getElementById('startScreen'),
  over: document.getElementById('overScreen'),
  fScore: document.getElementById('fScore'),
  fLevel: document.getElementById('fLevel'),
  newRec: document.getElementById('newRec'),
  pauseBtn: document.getElementById('pauseBtn')
};

let lastHud = { score:-1, hi:-1, lv:-1, lives:-1, energy:-1, ready:null };

function updateHUD(){
  if (game.score !== lastHud.score){ el.score.textContent = game.score; lastHud.score = game.score; }
  if (game.hi !== lastHud.hi){ el.hi.textContent = game.hi; lastHud.hi = game.hi; }
  if (game.level !== lastHud.lv){ el.lv.textContent = game.level; lastHud.lv = game.level; }
  if (game.lives !== lastHud.lives){
    el.lives.innerHTML = '';
    for (let i = 0; i < Math.max(0, game.lives); i++){
      const d = document.createElement('div'); d.className = 'heart'; el.lives.appendChild(d);
    }
    lastHud.lives = game.lives;
  }
  const e10 = Math.round(game.energy / 2) * 2;
  if (e10 !== lastHud.energy){ el.energyFill.style.width = game.energy + '%'; lastHud.energy = e10; }
  if (game.empReady !== lastHud.ready){
    el.energyWrap.classList.toggle('ready', game.empReady);
    lastHud.ready = game.empReady;
  }
}

/* ======================= 流程 ======================= */
let spawnTimer = 1;
let last = 0;

function resetGame(){
  game.score = 0; game.level = 1; game.lives = 3; game.energy = 0;
  game.empReady = false; game.time = 0; game.shake = 0; game.hitFlash = 0;
  game.combo = 0; game.comboTimer = 0;

  bullets.length = 0; eBullets.length = 0; enemies.length = 0;
  particles.length = 0; powerups.length = 0; floaters.length = 0;

  player.x = VW/2; player.y = VH - 130; player.invul = 2;
  player.fireLevel = 1; player.rapid = 0; player.shield = 0;

  spawnTimer = 1; shootTimer = 0;
  lastHud = { score:-1, hi:-1, lv:-1, lives:-1, energy:-1, ready:null };
  updateHUD();

  el.fScore.textContent = '0';
  el.fLevel.textContent = '1';
}

function startGame(){
  Sound.init();
  resetGame();
  el.start.classList.add('hide');
  el.over.classList.add('hide');
  state = STATE.PLAY;
  last = performance.now();
  requestAnimationFrame(loop);
}

function pause(){
  if (state !== STATE.PLAY) return;
  state = STATE.PAUSE;
  el.pauseBtn.textContent = '▶';
}
function resume(){
  if (state !== STATE.PAUSE) return;
  state = STATE.PLAY;
  el.pauseBtn.textContent = '❚❚';
  last = performance.now();
  requestAnimationFrame(loop);
}

function gameOver(){
  state = STATE.OVER;
  game.shake = 20;
  const isNew = game.score > game.hi;
  if (isNew){ game.hi = game.score; localStorage.setItem('neonStrikeHi', String(game.hi)); }
  el.fScore.textContent = game.score;
  el.fLevel.textContent = game.level;
  el.newRec.classList.toggle('hide', !isNew);
  setTimeout(() => el.over.classList.remove('hide'), 620);
  updateHUD();
}

el.pauseBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (state === STATE.PLAY) pause(); else if (state === STATE.PAUSE) resume();
});
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', startGame);

/* ======================= 主循环 ======================= */
function loop(now){
  if (state !== STATE.PLAY) return;
  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, .05);        // 防跳帧
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// 首屏静态画面
game.time = 0;
(function initStars(){ for (const s of stars) s.y = rand(0, VH); })();
el.hi.textContent = game.hi;
updateHUD();
draw();

})();
</script>
