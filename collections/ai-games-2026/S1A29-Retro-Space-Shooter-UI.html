<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Space Shooter UI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #03030c;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
        }

        .font-arcade {
            font-family: 'Press Start 2P', monospace;
        }

        .starfield {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: 
                radial-gradient(1.5px 1.5px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 40px 70px, #38bdf8, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #e879f9, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 230px 190px, #a855f7, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 250px 250px;
            animation: starsMove 12s linear infinite;
            z-index: 1;
        }

        @keyframes starsMove {
            from { background-position: 0 0; }
            to { background-position: 0 1000px; }
        }

        .nebula {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(168, 85, 247, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 60%, rgba(56, 189, 248, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 80%, rgba(236, 72, 153, 0.12) 0%, transparent 50%);
            z-index: 0;
            animation: nebulaPulse 8s ease-in-out infinite alternate;
        }

        @keyframes nebulaPulse {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        .neon-border {
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4), inset 0 0 15px rgba(56, 189, 248, 0.2);
            border: 2px solid rgba(56, 189, 248, 0.6);
        }

        .neon-text-cyan {
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.8), 0 0 15px rgba(56, 189, 248, 0.5);
        }

        .neon-text-pink {
            text-shadow: 0 0 8px rgba(236, 72, 153, 0.8), 0 0 15px rgba(236, 72, 153, 0.5);
        }

        .alien-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr); /* 6 Columns */
            grid-template-rows: repeat(4, 1fr);    /* 4 Rows */
            gap: 1.25rem 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .alien-card {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.25rem;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
            animation: floatAlien 2.5s ease-in-out infinite alternate;
            transition: transform 0.2s ease;
        }

        .alien-card:hover {
            transform: scale(1.25) rotate(5deg);
        }

        /* Stagger animation timing for aliens */
        .alien-grid > div:nth-child(even) .alien-card {
            animation-delay: 0.4s;
        }
        .alien-grid > div:nth-child(3n) .alien-card {
            animation-delay: 0.8s;
        }

        @keyframes floatAlien {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        .spaceship-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .spaceship {
            font-size: 3.5rem;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.9));
            animation: hoverShip 1.5s ease-in-out infinite alternate;
            cursor: pointer;
        }

        @keyframes hoverShip {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }

        /* Bullet CSS animation demonstration */
        .bullet {
            position: absolute;
            width: 4px;
            height: 18px;
            background: linear-gradient(to top, #38bdf8, #ffffff);
            border-radius: 9999px;
            box-shadow: 0 0 10px #38bdf8, 0 0 18px #38bdf8;
            animation: shootUp 1.8s cubic-bezier(0.1, 0.7, 0.1, 1) infinite;
            opacity: 0;
            z-index: 5;
        }

        /* Demo bullet streams firing upwards */
        .bullet-1 { left: calc(50% - 2px); animation-delay: 0s; }
        .bullet-2 { left: calc(50% - 2px); animation-delay: 0.6s; }
        .bullet-3 { left: calc(50% - 2px); animation-delay: 1.2s; }

        @keyframes shootUp {
            0% {
                bottom: 90px;
                opacity: 1;
                transform: scaleY(1);
            }
            85% {
                opacity: 1;
            }
            100% {
                bottom: calc(100vh - 120px);
                opacity: 0;
                transform: scaleY(1.5);
            }
        }

        /* Grid Boundaries Visualizer */
        .game-boundary {
            position: relative;
            z-index: 5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
    </style>
</head>
<body class="relative h-screen w-screen bg-slate-950 overflow-hidden">

    <div class="nebula"></div>
    <div class="starfield"></div>

    <div class="game-boundary p-4 md:p-6 max-w-7xl mx-auto">

        <header class="w-full flex justify-between items-center px-6 py-3 rounded-2xl bg-slate-900/60 backdrop-blur-md neon-border z-20">
            <!-- Score & Level -->
            <div class="flex items-center space-x-6">
                <div>
                    <span class="text-xs text-slate-400 block font-arcade">SCORE</span>
                    <span class="text-2xl font-bold font-arcade text-cyan-400 neon-text-cyan">02,450</span>
                </div>
                <div class="hidden sm:block border-l border-slate-700 h-8"></div>
                <div class="hidden sm:block">
                    <span class="text-xs text-slate-400 block font-arcade">STAGE</span>
                    <span class="text-xl font-bold font-arcade text-amber-400">01</span>
                </div>
            </div>

            <!-- Title Header -->
            <div class="hidden md:block text-center">
                <h1 class="text-xl font-bold font-arcade tracking-wider text-pink-500 neon-text-pink">GALAXY DEFENDER</h1>
            </div>

            <!-- Lives & Controls Hint -->
            <div class="flex items-center space-x-6">
                <div class="text-right">
                    <span class="text-xs text-slate-400 block font-arcade">LIVES</span>
                    <div class="flex space-x-1 text-lg">
                        <span>🚀</span>
                        <span>🚀</span>
                        <span>🚀</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="w-full flex-1 flex flex-col justify-start pt-8 pb-20 z-10">
            <!-- Alien Grid Container: 6 columns x 4 rows -->
            <div class="alien-grid w-full px-4">
                <!-- Row 1: 👾 -->
                <div class="alien-card">👾</div>
                <div class="alien-card">👾</div>
                <div class="alien-card">👾</div>
                <div class="alien-card">👾</div>
                <div class="alien-card">👾</div>
                <div class="alien-card">👾</div>

                <!-- Row 2: 🛸 -->
                <div class="alien-card">🛸</div>
                <div class="alien-card">🛸</div>
                <div class="alien-card">🛸</div>
                <div class="alien-card">🛸</div>
                <div class="alien-card">🛸</div>
                <div class="alien-card">🛸</div>

                <!-- Row 3: 👽 -->
                <div class="alien-card">👽</div>
                <div class="alien-card">👽</div>
                <div class="alien-card">👽</div>
                <div class="alien-card">👽</div>
                <div class="alien-card">👽</div>
                <div class="alien-card">👽</div>

                <!-- Row 4: 🤖 -->
                <div class="alien-card">🤖</div>
                <div class="alien-card">🤖</div>
                <div class="alien-card">🤖</div>
                <div class="alien-card">🤖</div>
                <div class="alien-card">🤖</div>
                <div class="alien-card">🤖</div>
            </div>
        </main>

        <div class="bullet bullet-1"></div>
        <div class="bullet bullet-2"></div>
        <div class="bullet bullet-3"></div>

        <div class="spaceship-container">
            <!-- Spaceship Visual -->
            <div class="spaceship" title="Player Ship">🚀</div>
            
            <!-- Controls Legend Footer -->
            <div class="mt-2 px-4 py-1.5 rounded-full bg-slate-900/80 backdrop-blur-md border border-slate-700 text-xs font-arcade text-slate-300 shadow-lg">
                <span class="text-cyan-400">A / D</span> OR <span class="text-cyan-400">← / →</span> MOVE &nbsp;|&nbsp; <span class="text-pink-400">SPACE</span> SHOOT
            </div>
        </div>

    </div>

</body>
</html>
