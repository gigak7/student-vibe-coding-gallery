<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空保衛戰 Space Defenders</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050510;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 畫布與星空背景 */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
        }

        /* 左上角 UI 資訊欄 */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
            z-index: 10;
            user-select: none;
        }

        /* 玩家飛船 */
        #player {
            position: absolute;
            bottom: 30px;
            font-size: 40px;
            transform: translateX(-50%);
            user-select: none;
            z-index: 5;
        }

        /* 外星人 */
        .alien {
            position: absolute;
            font-size: 32px;
            transform: translate(-50%, -50%);
            user-select: none;
            z-index: 4;
        }

        /* 玩家子彈 */
        .bullet {
            position: absolute;
            width: 4px;
            height: 16px;
            background-color: #ffeb3b;
            box-shadow: 0 0 8px #ffeb3b;
            border-radius: 2px;
            transform: translateX(-50%);
            z-index: 3;
        }

        /* 外星人子彈 */
        .alien-bullet {
            position: absolute;
            width: 6px;
            height: 14px;
            background-color: #ff4081;
            box-shadow: 0 0 8px #ff4081;
            border-radius: 3px;
            transform: translateX(-50%);
            z-index: 3;
        }

        /* 爆炸特效 */
        .explosion {
            position: absolute;
            font-size: 32px;
            transform: translate(-50%, -50%);
            z-index: 6;
            pointer-events: none;
        }

        /* 結算遮罩面板 */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #game-over-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        #game-over-screen h1 {
            font-size: 48px;
            color: #ff5252;
            margin-bottom: 10px;
            text-shadow: 0 0 12px rgba(255, 82, 82, 0.6);
        }

        #final-score {
            font-size: 24px;
            margin-bottom: 30px;
            color: #e0e0e0;
        }

        #restart-btn {
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(45deg, #2196f3, #21cbf3);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(33, 203, 243, 0.4);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        #restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(33, 203, 243, 0.6);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">
            Score: <span id="score">0</span>
        </div>

        <div id="player">🚀</div>

        <div id="game-over-screen">
            <h1>GAME OVER</h1>
            <div id="final-score">最終得分：0</div>
            <button id="restart-btn">Defend Again</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const player = document.getElementById('player');
        const scoreEl = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');

        // 狀態變數
        let score = 0;
        let isGameOver = false;

        // 玩家相關
        let playerX = window.innerWidth / 2;
        const playerSpeed = 8;
        const keys = { left: false, right: false };
        let spacePressed = false;
        let canShoot = true;

        // 陣列管理
        let bullets = [];
        let alienBullets = [];
        let aliens = [];

        // 外星人設定
        const alienRows = 4;
        const alienCols = 8;
        const alienEmojis = ['👾', '🛸', '👽', '🤖'];
        let alienDirection = 1; // 1 向右, -1 向左
        let alienSpeed = 1.5;
        let lastAlienShootTime = 0;
        const alienShootInterval = 1500; // 每 1.5 秒隨機發射

        // 1. 初始化與重生外星人
        function spawnAliens() {
            // 清理舊外星人
            aliens.forEach(a => a.el.remove());
            aliens = [];

            const startY = 80;
            const spacingX = Math.min(window.innerWidth * 0.8, 700) / alienCols;
            const startX = (window.innerWidth - (spacingX * (alienCols - 1))) / 2;

            for (let row = 0; row < alienRows; row++) {
                for (let col = 0; col < alienCols; col++) {
                    const el = document.createElement('div');
                    el.className = 'alien';
                    el.textContent = alienEmojis[row % alienEmojis.length];

                    const x = startX + col * spacingX;
                    const y = startY + row * 50;

                    el.style.left = `${x}px`;
                    el.style.top = `${y}px`;

                    container.appendChild(el);
                    aliens.push({ x, y, el });
                }
            }
        }

        // 2. 鍵盤輸入監聽
        window.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;

            if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault();
                if (!spacePressed && canShoot) {
                    shootBullet();
                    canShoot = false;
                }
                spacePressed = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;

            if (e.key === ' ' || e.code === 'Space') {
                spacePressed = false;
                canShoot = true; // 放開鍵盤才能再次單發發射
            }
        });

        // 3. 玩家發射子彈
        function shootBullet() {
            const el = document.createElement('div');
            el.className = 'bullet';
            const x = playerX;
            const y = window.innerHeight - 70;

            el.style.left = `${x}px`;
            el.style.top = `${y}px`;

            container.appendChild(el);
            bullets.push({ x, y, el });
        }

        // 4. 外星人發射子彈
        function alienShoot() {
            if (aliens.length === 0) return;
            const shooter = aliens[Math.floor(Math.random() * aliens.length)];

            const el = document.createElement('div');
            el.className = 'alien-bullet';
            const x = shooter.x;
            const y = shooter.y + 20;

            el.style.left = `${x}px`;
            el.style.top = `${y}px`;

            container.appendChild(el);
            alienBullets.push({ x, y, el });
        }

        // 5. 爆炸特效
        function createExplosion(x, y) {
            const el = document.createElement('div');
            el.className = 'explosion';
            el.textContent = '💥';
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            container.appendChild(el);

            setTimeout(() => el.remove(), 200);
        }

        // 6. 主遊戲循環 (Game Loop)
        let lastTime = performance.now();

        function gameLoop(time) {
            if (isGameOver) return;

            // 6.1 移動玩家
            if (keys.left) playerX = Math.max(30, playerX - playerSpeed);
            if (keys.right) playerX = Math.min(window.innerWidth - 30, playerX + playerSpeed);
            player.style.left = `${playerX}px`;

            // 6.2 移動玩家子彈
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.y -= 12;
                b.el.style.top = `${b.y}px`;

                // 飛出畫面清理
                if (b.y < -20) {
                    b.el.remove();
                    bullets.splice(i, 1);
                }
            }

            // 6.3 移動外星人陣列
            let hitEdge = false;
            aliens.forEach(a => {
                if ((a.x + alienDirection * alienSpeed > window.innerWidth - 30 && alienDirection > 0) ||
                    (a.x + alienDirection * alienSpeed < 30 && alienDirection < 0)) {
                    hitEdge = true;
                }
            });

            if (hitEdge) {
                alienDirection *= -1;
                alienSpeed += 0.2; // 撞牆下沉並加速
                aliens.forEach(a => {
                    a.y += 20;
                });
            }

            aliens.forEach(a => {
                a.x += alienDirection * alienSpeed;
                a.el.style.left = `${a.x}px`;
                a.el.style.top = `${a.y}px`;

                // 觸底輸掉遊戲
                if (a.y >= window.innerHeight - 90) {
                    triggerGameOver();
                }
            });

            // 6.4 外星人攻擊計時
            if (time - lastAlienShootTime > alienShootInterval) {
                alienShoot();
                lastAlienShootTime = time;
            }

            // 6.5 移動外星人子彈
            for (let i = alienBullets.length - 1; i >= 0; i--) {
                const ab = alienBullets[i];
                ab.y += 6;
                ab.el.style.top = `${ab.y}px`;

                // 判定擊中玩家
                if (Math.abs(ab.x - playerX) < 25 && ab.y >= window.innerHeight - 70 && ab.y <= window.innerHeight - 30) {
                    createExplosion(playerX, window.innerHeight - 50);
                    triggerGameOver();
                    return;
                }

                // 飛出畫面清理
                if (ab.y > window.innerHeight + 20) {
                    ab.el.remove();
                    alienBullets.splice(i, 1);
                }
            }

            // 6.6 碰撞檢測：玩家子彈 vs 外星人
            for (let bIndex = bullets.length - 1; bIndex >= 0; bIndex--) {
                const b = bullets[bIndex];

                for (let aIndex = aliens.length - 1; aIndex >= 0; aIndex--) {
                    const a = aliens[aIndex];

                    if (Math.abs(b.x - a.x) < 25 && Math.abs(b.y - a.y) < 25) {
                        createExplosion(a.x, a.y);

                        // 刪除 DOM 與物件
                        a.el.remove();
                        aliens.splice(aIndex, 1);

                        b.el.remove();
                        bullets.splice(bIndex, 1);

                        // 加分與更新 UI
                        score += 10;
                        scoreEl.textContent = score;
                        break;
                    }
                }
            }

            // 6.7 外星人全滅，進入下一波
            if (aliens.length === 0) {
                alienSpeed += 0.5;
                spawnAliens();
            }

            requestAnimationFrame(gameLoop);
        }

        // 7. 結束遊戲
        function triggerGameOver() {
            isGameOver = true;
            finalScoreEl.textContent = `最終得分：${score}`;
            gameOverScreen.classList.add('active');
        }

        // 8. 重新開始遊戲
        restartBtn.addEventListener('click', () => {
            // 清空舊子彈
            bullets.forEach(b => b.el.remove());
            alienBullets.forEach(ab => ab.el.remove());
            bullets = [];
            alienBullets = [];

            // 重置參數
            score = 0;
            scoreEl.textContent = score;
            alienSpeed = 1.5;
            alienDirection = 1;
            playerX = window.innerWidth / 2;
            player.style.left = `${playerX}px`;

            isGameOver = false;
            gameOverScreen.classList.remove('active');

            spawnAliens();
            requestAnimationFrame(gameLoop);
        });

        // 視窗縮放自動置中 player
        window.addEventListener('resize', () => {
            playerX = Math.min(window.innerWidth - 30, Math.max(30, playerX));
            player.style.left = `${playerX}px`;
        });

        // 開局初始化
        spawnAliens();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
