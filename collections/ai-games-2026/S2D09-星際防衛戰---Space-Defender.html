<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星際防衛戰 - Space Defender</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(ellipse at bottom, #111827 0%, #030712 100%);
    }

    .star-field {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, #dddddd, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 230px 200px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 300px 80px, #eeeeee, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 320px 320px;
      opacity: 0.75;
      z-index: 1;
    }

    .score-glow {
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.8), 0 0 20px rgba(0, 229, 255, 0.4);
    }

    .player-rocket {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 52px;
      line-height: 1;
      filter: drop-shadow(0 0 12px rgba(255, 120, 0, 0.85));
      will-change: left;
      z-index: 10;
    }

    #alien-container {
      position: absolute;
      top: 80px;
      left: 0px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 16px 28px;
      padding: 10px;
      will-change: transform;
      z-index: 5;
    }

    .alien {
      font-size: 38px;
      text-align: center;
      line-height: 1;
      filter: drop-shadow(0 0 8px rgba(0, 255, 200, 0.5));
      transition: transform 0.1s ease;
    }

    /* Player bullet style */
    .bullet {
      position: absolute;
      width: 4px;
      height: 18px;
      background: #00e5ff;
      border-radius: 2px;
      box-shadow: 0 0 8px #00e5ff, 0 0 16px #00e5ff;
      transform: translateX(-50%);
      will-change: top;
      z-index: 8;
    }

    /* Enemy bullet style */
    .alien-bullet {
      position: absolute;
      width: 5px;
      height: 18px;
      background: #ff0055;
      border-radius: 3px;
      box-shadow: 0 0 8px #ff0055, 0 0 16px #ff0055;
      transform: translateX(-50%);
      will-change: top;
      z-index: 8;
    }

    .explosion {
      position: absolute;
      font-size: 42px;
      line-height: 1;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: popExplode 0.35s ease-out forwards;
      z-index: 15;
    }

    @keyframes popExplode {
      0% {
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 1;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.4);
        opacity: 0.9;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.8);
        opacity: 0;
      }
    }
  </style>
</head>
<body class="relative w-full h-full">

  <div class="star-field"></div>

  <div class="score-glow absolute top-6 left-6 text-white font-bold tracking-wider z-20 flex flex-col gap-1">
    <div class="text-2xl md:text-3xl">Score: <span id="score">0</span> / 2000</div>
    <div class="text-sm md:text-base text-cyan-300 opacity-90">Wave <span id="wave">1</span></div>
  </div>

  <div id="alien-container"></div>

  <div class="player-rocket" id="player">🚀</div>

  <div id="end-game-modal" class="hidden absolute inset-0 bg-black/85 backdrop-blur-md z-50 flex flex-col items-center justify-center text-center p-6 transition-all duration-300">
    <div id="modal-icon" class="text-6xl mb-4 animate-bounce">💥</div>
    <h1 id="modal-title" class="text-4xl md:text-5xl font-black mb-2 text-rose-500 tracking-wider">
      GAME OVER
    </h1>
    <p class="text-gray-300 text-lg md:text-xl mb-6">
      最終得分：<span id="final-score" class="text-cyan-400 font-bold">0</span> 分
    </p>
    <button onclick="restartGame()" class="px-8 py-3 bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-400 hover:to-blue-400 text-black font-extrabold text-lg rounded-full shadow-lg shadow-cyan-500/50 transition-all hover:scale-105 active:scale-95 cursor-pointer border-2 border-cyan-300">
      Defend Again
    </button>
  </div>

  <script>
    const player = document.getElementById('player');
    const alienContainer = document.getElementById('alien-container');
    const scoreDisplay = document.getElementById('score');
    const waveDisplay = document.getElementById('wave');
    const endGameModal = document.getElementById('end-game-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalIcon = document.getElementById('modal-icon');
    const finalScoreDisplay = document.getElementById('final-score');

    let score = 0;
    let wave = 1;
    let isGameOver = false;

    let playerX = window.innerWidth / 2;
    const playerSpeed = 8;
    const keys = { left: false, right: false };

    const bullets = [];
    const bulletSpeed = 14;
    let canShoot = true;

    // Alien bullets tracking array & timers
    const alienBullets = [];
    const alienBulletSpeed = 5.5;
    let alienShootInterval = null;

    const rowEmojis = ['🤖', '👽', '🛸', '👾'];
    const rows = 4;
    const cols = 8;
    let activeAlienCount = 0;
    let alienPosX = 0;
    let alienPosY = 0;
    let alienDirection = 1;

    let baseWaveSpeed = 0.8;
    let alienSpeed = 0.8;
    const speedIncrement = 0.15;
    const dropStep = 18;

    function buildAlienFleet() {
      alienContainer.innerHTML = '';
      activeAlienCount = rows * cols;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const alien = document.createElement('div');
          alien.className = 'alien';
          alien.textContent = rowEmojis[r];
          alien.dataset.alive = "true";
          alienContainer.appendChild(alien);
        }
      }

      const containerWidth = alienContainer.offsetWidth;
      alienPosX = (window.innerWidth - containerWidth) / 2;
      alienPosY = 0;
      alienDirection = 1;
      alienSpeed = baseWaveSpeed;
      updateAlienPosition();

      startAlienShooting();
    }

    function startAlienShooting() {
      if (alienShootInterval) clearInterval(alienShootInterval);
      alienShootInterval = setInterval(() => {
        if (!isGameOver) {
          triggerAlienShoot();
        }
      }, 2000); // Shoot every 2 seconds (2000ms)
    }

    function triggerAlienShoot() {
      const aliens = Array.from(alienContainer.children);
      const aliveAliens = aliens.filter(alien => alien.dataset.alive === "true");

      if (aliveAliens.length === 0) return;

      // Pick a random alive alien
      const randomAlien = aliveAliens[Math.floor(Math.random() * aliveAliens.length)];
      const rect = randomAlien.getBoundingClientRect();

      const alienBullet = document.createElement('div');
      alienBullet.className = 'alien-bullet';

      const bulletX = rect.left + rect.width / 2;
      const bulletY = rect.bottom;

      alienBullet.style.left = `${bulletX}px`;
      alienBullet.style.top = `${bulletY}px`;

      document.body.appendChild(alienBullet);

      alienBullets.push({
        element: alienBullet,
        x: bulletX,
        y: bulletY
      });
    }

    function updateAlienPosition() {
      alienContainer.style.transform = `translate(${alienPosX}px, ${alienPosY}px)`;
    }

    function updatePlayerPosition() {
      player.style.left = `${playerX}px`;
    }

    function createExplosion(x, y) {
      const exp = document.createElement('div');
      exp.className = 'explosion';
      exp.textContent = '💥';
      exp.style.left = `${x}px`;
      exp.style.top = `${y}px`;
      document.body.appendChild(exp);

      setTimeout(() => {
        exp.remove();
      }, 350);
    }

    window.addEventListener('keydown', (e) => {
      if (isGameOver) return;

      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        keys.left = true;
      }
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        keys.right = true;
      }
      if (e.code === 'Space' && canShoot) {
        shootBullet();
        canShoot = false;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        keys.left = false;
      }
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        keys.right = false;
      }
      if (e.code === 'Space') {
        canShoot = true;
      }
    });

    function shootBullet() {
      const bullet = document.createElement('div');
      bullet.className = 'bullet';

      const playerRect = player.getBoundingClientRect();
      const bulletX = playerX;
      const bulletY = playerRect.top;

      bullet.style.left = `${bulletX}px`;
      bullet.style.top = `${bulletY}px`;

      document.body.appendChild(bullet);

      bullets.push({
        element: bullet,
        x: bulletX,
        y: bulletY
      });
    }

    function checkCollisions(bullet, bulletIdx) {
      const bulletRect = bullet.element.getBoundingClientRect();
      const aliens = alienContainer.children;

      for (let i = 0; i < aliens.length; i++) {
        const alien = aliens[i];

        if (alien.dataset.alive === "true") {
          const alienRect = alien.getBoundingClientRect();

          if (
            bulletRect.left < alienRect.right &&
            bulletRect.right > alienRect.left &&
            bulletRect.top < alienRect.bottom &&
            bulletRect.bottom > alienRect.top
          ) {
            alien.dataset.alive = "false";
            alien.style.visibility = 'hidden';

            const hitX = alienRect.left + alienRect.width / 2;
            const hitY = alienRect.top + alienRect.height / 2;
            createExplosion(hitX, hitY);

            bullet.element.remove();
            bullets.splice(bulletIdx, 1);

            score += 10;
            scoreDisplay.textContent = score;

            activeAlienCount--;

            if (score >= 2000) {
              endGame(true);
              return true;
            }

            if (activeAlienCount === 0) {
              nextWave();
            }

            return true;
          }
        }
      }
      return false;
    }

    function checkAlienBulletsPlayerCollision() {
      const playerRect = player.getBoundingClientRect();

      for (let i = alienBullets.length - 1; i >= 0; i--) {
        const ab = alienBullets[i];
        const abRect = ab.element.getBoundingClientRect();

        // Player rocket hit box detection
        if (
          abRect.left < playerRect.right - 8 &&
          abRect.right > playerRect.left + 8 &&
          abRect.top < playerRect.bottom &&
          abRect.bottom > playerRect.top + 10
        ) {
          createExplosion(playerX, playerRect.top + playerRect.height / 2);
          endGame(false);
          return;
        }
      }
    }

    function nextWave() {
      wave++;
      waveDisplay.textContent = wave;
      baseWaveSpeed += 0.4;
      buildAlienFleet();
    }

    function endGame(isVictory) {
      isGameOver = true;
      if (alienShootInterval) clearInterval(alienShootInterval);

      finalScoreDisplay.textContent = score;

      if (isVictory) {
        modalIcon.textContent = '🏆';
        modalTitle.textContent = 'MISSION ACCOMPLISHED!';
        modalTitle.className = "text-4xl md:text-5xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-emerald-400 tracking-wider";
      } else {
        modalIcon.textContent = '👾';
        modalTitle.textContent = 'GAME OVER';
        modalTitle.className = "text-4xl md:text-5xl font-black mb-2 text-rose-500 tracking-wider";
      }

      endGameModal.classList.remove('hidden');
    }

    function restartGame() {
      score = 0;
      wave = 1;
      baseWaveSpeed = 0.8;
      isGameOver = false;

      scoreDisplay.textContent = score;
      waveDisplay.textContent = wave;

      playerX = window.innerWidth / 2;
      updatePlayerPosition();

      // Clear player bullets
      bullets.forEach(b => b.element.remove());
      bullets.length = 0;

      // Clear alien bullets
      alienBullets.forEach(ab => ab.element.remove());
      alienBullets.length = 0;

      endGameModal.classList.add('hidden');
      buildAlienFleet();
    }

    window.addEventListener('resize', () => {
      const halfWidth = player.offsetWidth / 2;
      playerX = Math.max(halfWidth, Math.min(window.innerWidth - halfWidth, playerX));
      updatePlayerPosition();
    });

    function gameLoop() {
      if (!isGameOver) {
        const halfWidth = player.offsetWidth / 2;
        if (keys.left) {
          playerX -= playerSpeed;
          if (playerX < halfWidth) playerX = halfWidth;
        }
        if (keys.right) {
          playerX += playerSpeed;
          if (playerX > window.innerWidth - halfWidth) playerX = window.innerWidth - halfWidth;
        }
        updatePlayerPosition();

        alienPosX += alienSpeed * alienDirection;
        const containerWidth = alienContainer.offsetWidth;

        if (alienDirection === 1 && (alienPosX + containerWidth) >= window.innerWidth - 10) {
          alienDirection = -1;
          alienPosY += dropStep;
          alienSpeed += speedIncrement;
        } else if (alienDirection === -1 && alienPosX <= 10) {
          alienDirection = 1;
          alienPosY += dropStep;
          alienSpeed += speedIncrement;
        }
        updateAlienPosition();

        // Check aliens reaching rocket bottom
        const playerTop = player.getBoundingClientRect().top;
        const alienBottom = alienContainer.getBoundingClientRect().bottom;
        if (alienBottom >= playerTop - 10) {
          endGame(false);
        }

        // Update player bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.y -= bulletSpeed;
          b.element.style.top = `${b.y}px`;

          const collided = checkCollisions(b, i);

          if (!collided && b.y < -20) {
            b.element.remove();
            bullets.splice(i, 1);
          }
        }

        // Update alien enemy bullets
        for (let i = alienBullets.length - 1; i >= 0; i--) {
          const ab = alienBullets[i];
          ab.y += alienBulletSpeed;
          ab.element.style.top = `${ab.y}px`;

          if (ab.y > window.innerHeight + 20) {
            ab.element.remove();
            alienBullets.splice(i, 1);
          }
        }

        // Check if player gets hit by alien bullet
        checkAlienBulletsPlayerCollision();
      }

      requestAnimationFrame(gameLoop);
    }

    window.onload = () => {
      updatePlayerPosition();
      buildAlienFleet();
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
</html>
