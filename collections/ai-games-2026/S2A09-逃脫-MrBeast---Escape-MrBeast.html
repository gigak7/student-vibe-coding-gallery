<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>逃脫 MrBeast - Escape MrBeast</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0d0f18;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 580px;
            height: 92vh;
            max-height: 850px;
            background: #141824;
            border: 4px solid #00e5ff;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.3), inset 0 0 15px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #canvas-container {
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a2035 0%, #080a10 100%);
        }
        /* Mobile Touch Controls */
        #mobile-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(10, 12, 20, 0.95);
            border-top: 2px solid #2a324d;
            gap: 15px;
        }
        .d-pad {
            display: flex;
            gap: 12px;
        }
        .btn {
            background: linear-gradient(135deg, #2a324d, #1a2032);
            border: 2px solid #00e5ff;
            color: #00e5ff;
            font-weight: bold;
            font-size: 18px;
            padding: 14px 24px;
            border-radius: 12px;
            touch-action: manipulation;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
        }
        .btn:active {
            transform: scale(0.92);
            background: #00e5ff;
            color: #000;
        }
        .btn-shoot {
            background: linear-gradient(135deg, #ff0055, #990033);
            border-color: #ff0055;
            color: #fff;
            flex: 1;
            font-size: 20px;
            letter-spacing: 1px;
        }
        .btn-shoot:active {
            background: #ff0055;
            color: #fff;
        }
        /* Overlays */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(8, 10, 16, 0.88);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            z-index: 10;
        }
        .overlay h1 {
            font-size: 38px;
            color: #00e5ff;
            text-shadow: 0 0 15px rgba(0,229,255,0.6);
            margin-bottom: 10px;
        }
        .overlay p {
            font-size: 15px;
            color: #cbd5e1;
            margin-bottom: 8px;
            line-height: 1.5;
        }
        .start-btn {
            margin-top: 20px;
            padding: 14px 40px;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #00e5ff, #0066ff);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0,229,255,0.5);
            transition: transform 0.2s;
        }
        .start-btn:hover {
            transform: scale(1.05);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="canvas-container">
        <canvas id="gameCanvas" width="600" height="850"></canvas>
        
        <!-- Start Screen -->
        <div id="start-overlay" class="overlay">
            <h1>🚀 逃脫 MrBeast</h1>
            <p><strong>目標：</strong>挑戰 10 波次，達到 1000 分過關！</p>
            <p>👾 <strong>小怪 (Speed)：</strong>打 3 下死 (+5分 / 擊殺5隻過關)</p>
            <p>⚡ <strong>衝刺怪：</strong>有紅色雷射預警並高速撞擊！</p>
            <p>👑 <strong>第 5 波 Boss：</strong>10 HP | 150 HP (+200分)</p>
            <p>🔥 <strong>第 10 波 Boss：</strong><strong>20 HP</strong> | 500 HP (+600分 & 攻擊x2)</p>
            <p>🎯 <strong>兩旁側翼彈幕：</strong>瞄準玩家位置發射！</p>
            <p>💖 <strong>每波開始：</strong>血量自動全滿回復！</p>
            <button class="start-btn" onclick="startGame()">開始遊戲</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-overlay" class="overlay hidden">
            <h1 style="color: #ff3366;">GAME OVER</h1>
            <p id="gameover-reason" style="font-size: 18px; margin-bottom: 15px;"></p>
            <p id="final-score" style="font-size: 22px; color: #ffcc00; font-weight: bold;"></p>
            <button class="start-btn" onclick="restartGame()">再試一次</button>
        </div>

        <!-- Victory Screen -->
        <div id="victory-overlay" class="overlay hidden">
            <h1 style="color: #00ffcc;">🎉 成功逃脫！</h1>
            <p style="font-size: 18px;">你成功擊退了所有的 IShowSpeed！</p>
            <p id="victory-score" style="font-size: 24px; color: #ffcc00; font-weight: bold; margin: 15px 0;"></p>
            <button class="start-btn" onclick="restartGame()">再次挑戰</button>
        </div>
    </div>

    <!-- Mobile Buttons -->
    <div id="mobile-controls">
        <div class="d-pad">
            <button class="btn" id="btn-left">◀</button>
            <button class="btn" id="btn-right">▶</button>
        </div>
        <button class="btn btn-shoot" id="btn-shoot">🔥 發射子彈</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game State Variables
let gameState = 'START';
let score = 0;
let currentWave = 1;
let waveKills = 0;
const KILLS_PER_WAVE = 5;
let isBossWave = false;

// Images with fallback
const imgPlayer = new Image();
imgPlayer.crossOrigin = "anonymous";
imgPlayer.src = "https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=150&auto=format&fit=crop&q=80";

const imgEnemy = new Image();
imgEnemy.crossOrigin = "anonymous";
imgEnemy.src = "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80";

// Audio Engine
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    const now = audioCtx.currentTime;
    if (type === 'shoot') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.1);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(60, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
    } else if (type === 'explode') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.linearRampToValueAtTime(30, now + 0.25);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
    } else if (type === 'heal') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
    } else if (type === 'warn') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.setValueAtTime(400, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
    }
}

// Player Object
const player = {
    x: canvas.width / 2,
    y: canvas.height - 90,
    width: 50,
    height: 50,
    speed: 7,
    hp: 2,
    maxHp: 2,
    shootCooldown: 0
};

// Key controls
const keys = { left: false, right: false, shoot: false };

window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if (e.key === ' ' || e.key === 'Spacebar') keys.shoot = true;
});

window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    if (e.key === ' ' || e.key === 'Spacebar') keys.shoot = false;
});

// Touch controls
const bindBtn = (id, keyName) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; initAudio(); });
    el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
    el.addEventListener('mousedown', () => { keys[keyName] = true; initAudio(); });
    el.addEventListener('mouseup', () => { keys[keyName] = false; });
};
bindBtn('btn-left', 'left');
bindBtn('btn-right', 'right');
bindBtn('btn-shoot', 'shoot');

// Game Objects
let playerBullets = [];
let enemies = [];
let enemyBullets = [];
let particles = [];
let floatingTexts = [];
let activeBoss = null;
let enemySpawnTimer = 0;

function createExplosion(x, y, color = '#ff5500', count = 15) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            radius: Math.random() * 4 + 2,
            color,
            alpha: 1,
            life: 0.03
        });
    }
}

function addFloatingText(text, x, y, color = '#00ffcc') {
    floatingTexts.push({ text, x, y, alpha: 1, color, vy: -1.5 });
}

function spawnDashingMinions(count = 2) {
    for (let i = 0; i < count; i++) {
        const spawnX = (i === 0) ? 80 : canvas.width - 80;
        enemies.push({
            x: spawnX,
            y: 80,
            width: 46,
            height: 46,
            hp: 3,
            maxHp: 3,
            speedY: 2,
            isDash: true,
            dashState: 'CHARGING',
            chargeTimer: 30,
            vx: 0, vy: 0,
            shootTimer: 0
        });
    }
    playSound('warn');
    addFloatingText('BOSS 召喚衝刺怪！', canvas.width/2 - 70, 160, '#ff0055');
}

function setupWave(waveNum) {
    currentWave = waveNum;
    waveKills = 0;
    enemies = [];
    enemyBullets = [];
    activeBoss = null;
    
    if (waveNum === 5) {
        isBossWave = true;
        player.maxHp = 10;
        player.hp = 10;
        activeBoss = {
            x: canvas.width / 2,
            y: 120,
            width: 100,
            height: 100,
            hp: 150,
            maxHp: 150,
            name: 'SPEED GIANT',
            vx: 3,
            shootTimer: 0,
            summonTimer: 0,
            sideCannonTimer: 0,
            attackPattern: 0,
            reward: 200
        };
        addFloatingText(`WAVE 5 BOSS! HP = 10!`, canvas.width/2 - 100, canvas.height/2, '#ff3366');
    } else if (waveNum === 10) {
        isBossWave = true;
        player.maxHp = 20; // 20 HP for Wave 10
        player.hp = 20;
        activeBoss = {
            x: canvas.width / 2,
            y: 120,
            width: 120,
            height: 120,
            hp: 500,
            maxHp: 500,
            name: 'ULTIMATE SPEED',
            vx: 4.5,
            shootTimer: 0,
            summonTimer: 0,
            sideCannonTimer: 0,
            attackPattern: 0,
            reward: 600 // 600 PTS for Wave 10
        };
        addFloatingText(`WAVE 10 FINAL BOSS! HP = 20!`, canvas.width/2 - 130, canvas.height/2, '#ff3366');
    } else {
        isBossWave = false;
        player.maxHp = 2;
        player.hp = 2;
        addFloatingText(`WAVE ${waveNum} - HP RESTORED!`, canvas.width/2 - 100, canvas.height/2, '#00ffcc');
    }
    playSound('heal');
}

function spawnEnemy() {
    if (isBossWave || enemies.length >= 4) return;
    const isDash = Math.random() < 0.35;
    enemies.push({
        x: Math.random() * (canvas.width - 60) + 30,
        y: -50,
        width: 46,
        height: 46,
        hp: 3,
        maxHp: 3,
        speedY: Math.random() * 1.5 + 1.2,
        isDash: isDash,
        dashState: 'NORMAL',
        chargeTimer: 0,
        vx: 0, vy: 0,
        shootTimer: Math.random() * 100
    });
}

function startGame() {
    initAudio();
    document.getElementById('start-overlay').classList.add('hidden');
    document.getElementById('gameover-overlay').classList.add('hidden');
    document.getElementById('victory-overlay').classList.add('hidden');
    score = 0;
    player.x = canvas.width / 2;
    setupWave(1);
    gameState = 'PLAYING';
}

function restartGame() {
    startGame();
}

function update() {
    if (gameState !== 'PLAYING') return;

    // Movement
    if (keys.left && player.x - player.width / 2 > 0) player.x -= player.speed;
    if (keys.right && player.x + player.width / 2 < canvas.width) player.x += player.speed;

    // Shooting
    if (player.shootCooldown > 0) player.shootCooldown--;
    if (keys.shoot && player.shootCooldown <= 0) {
        const bulletDamage = (currentWave === 10) ? 2 : 1;
        playerBullets.push({
            x: player.x,
            y: player.y - player.height / 2,
            vy: -12,
            damage: bulletDamage
        });
        player.shootCooldown = 9;
        playSound('shoot');
    }

    // Player Bullets
    for (let i = playerBullets.length - 1; i >= 0; i--) {
        let b = playerBullets[i];
        b.y += b.vy;
        if (b.y < -10) { playerBullets.splice(i, 1); continue; }

        if (activeBoss) {
            if (Math.abs(b.x - activeBoss.x) < activeBoss.width / 2 &&
                Math.abs(b.y - activeBoss.y) < activeBoss.height / 2) {
                activeBoss.hp -= b.damage;
                createExplosion(b.x, b.y, '#00e5ff', 5);
                playSound('hit');
                playerBullets.splice(i, 1);

                if (activeBoss.hp <= 0) {
                    score += activeBoss.reward;
                    createExplosion(activeBoss.x, activeBoss.y, '#ff0055', 60);
                    playSound('explode');
                    addFloatingText(`+${activeBoss.reward} PTS!`, activeBoss.x - 30, activeBoss.y, '#ffcc00');
                    activeBoss = null;

                    if (currentWave === 10 || score >= 1000) {
                        gameState = 'VICTORY';
                        document.getElementById('victory-score').innerText = `最終得分: ${score}`;
                        document.getElementById('victory-overlay').classList.remove('hidden');
                    } else {
                        setupWave(currentWave + 1);
                    }
                }
                continue;
            }
        }

        for (let j = enemies.length - 1; j >= 0; j--) {
            let e = enemies[j];
            if (Math.abs(b.x - e.x) < e.width / 2 && Math.abs(b.y - e.y) < e.height / 2) {
                e.hp -= b.damage;
                createExplosion(b.x, b.y, '#ffcc00', 5);
                playSound('hit');
                playerBullets.splice(i, 1);

                if (e.hp <= 0) {
                    score += 5;
                    waveKills++;
                    createExplosion(e.x, e.y, '#ff5500', 18);
                    playSound('explode');
                    addFloatingText('+5', e.x, e.y, '#00ffcc');
                    enemies.splice(j, 1);

                    if (score >= 1000) {
                        gameState = 'VICTORY';
                        document.getElementById('victory-score').innerText = `最終得分: ${score}`;
                        document.getElementById('victory-overlay').classList.remove('hidden');
                        return;
                    }

                    if (!isBossWave && waveKills >= KILLS_PER_WAVE) {
                        setupWave(currentWave + 1);
                    }
                }
                break;
            }
        }
    }

    // Spawn Normal Enemies
    if (!isBossWave) {
        enemySpawnTimer++;
        if (enemySpawnTimer > 60) {
            spawnEnemy();
            enemySpawnTimer = 0;
        }
    }

    // Update Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];

        if (e.isDash) {
            if (e.dashState === 'NORMAL') {
                e.y += e.speedY;
                if (e.y > 150) {
                    e.dashState = 'CHARGING';
                    e.chargeTimer = 35;
                    playSound('warn');
                }
            } else if (e.dashState === 'CHARGING') {
                e.chargeTimer--;
                if (e.chargeTimer <= 0) {
                    e.dashState = 'DASHING';
                    const angle = Math.atan2(player.y - e.y, player.x - e.x);
                    e.vx = Math.cos(angle) * 11;
                    e.vy = Math.sin(angle) * 11;
                }
            } else if (e.dashState === 'DASHING') {
                e.x += e.vx;
                e.y += e.vy;
            }
        } else {
            e.y += e.speedY;
            e.shootTimer++;
            if (e.shootTimer > 120) {
                enemyBullets.push({ x: e.x, y: e.y + 20, vx: 0, vy: 5, color: '#ff0055' });
                e.shootTimer = 0;
            }
        }

        // Collision with player
        if (Math.abs(e.x - player.x) < (e.width + player.width) / 3 &&
            Math.abs(e.y - player.y) < (e.height + player.height) / 3) {
            player.hp--;
            createExplosion(player.x, player.y, '#ff0000', 20);
            playSound('explode');
            enemies.splice(i, 1);
            if (player.hp <= 0) triggerGameOver('你被 IShowSpeed 撞飛了！');
            continue;
        }

        if (e.y > canvas.height + 50 || e.x < -50 || e.x > canvas.width + 50) {
            enemies.splice(i, 1);
        }
    }

    // Boss Mechanics
    if (activeBoss) {
        activeBoss.x += activeBoss.vx;
        if (activeBoss.x - activeBoss.width / 2 < 20 || activeBoss.x + activeBoss.width / 2 > canvas.width - 20) {
            activeBoss.vx *= -1;
        }

        // 1. Boss Summons 2 Dashing Speed Minions
        activeBoss.summonTimer++;
        if (activeBoss.summonTimer > 280) {
            spawnDashingMinions(2);
            activeBoss.summonTimer = 0;
        }

        // 2. Target-tracking Side Cannon Barrage
        activeBoss.sideCannonTimer++;
        if (activeBoss.sideCannonTimer > 170) {
            // Left Wall Cannon targeting Player directly
            const leftAngle = Math.atan2(player.y - 350, player.x - 10);
            enemyBullets.push({
                x: 10, y: 350,
                vx: Math.cos(leftAngle) * 7.5,
                vy: Math.sin(leftAngle) * 7.5,
                color: '#ffcc00'
            });

            // Right Wall Cannon targeting Player directly
            const rightAngle = Math.atan2(player.y - 350, player.x - (canvas.width - 10));
            enemyBullets.push({
                x: canvas.width - 10, y: 350,
                vx: Math.cos(rightAngle) * 7.5,
                vy: Math.sin(rightAngle) * 7.5,
                color: '#ffcc00'
            });

            playSound('shoot');
            addFloatingText('兩旁側翼死角瞄準！', canvas.width/2 - 70, 220, '#ffcc00');
            activeBoss.sideCannonTimer = 0;
        }

        // 3. Regular Boss Barrage
        activeBoss.shootTimer++;
        const fireInterval = (currentWave === 10) ? 35 : 55;
        if (activeBoss.shootTimer > fireInterval) {
            activeBoss.shootTimer = 0;
            activeBoss.attackPattern = (activeBoss.attackPattern + 1) % 2;

            if (activeBoss.attackPattern === 0) {
                for (let a = -0.6; a <= 0.6; a += 0.3) {
                    enemyBullets.push({
                        x: activeBoss.x, y: activeBoss.y + 40,
                        vx: Math.sin(a) * 5, vy: Math.cos(a) * 5,
                        color: '#ffcc00'
                    });
                }
            } else {
                const bulletCount = (currentWave === 10) ? 14 : 8;
                for (let k = 0; k < bulletCount; k++) {
                    const angle = (Math.PI * 2 / bulletCount) * k;
                    enemyBullets.push({
                        x: activeBoss.x, y: activeBoss.y + 20,
                        vx: Math.cos(angle) * 4.5, vy: Math.sin(angle) * 4.5,
                        color: '#ff0055'
                    });
                }
            }
        }
    }

    // Enemy Bullets
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        let eb = enemyBullets[i];
        eb.x += eb.vx;
        eb.y += eb.vy;

        if (Math.abs(eb.x - player.x) < player.width / 2.5 &&
            Math.abs(eb.y - player.y) < player.height / 2.5) {
            player.hp--;
            createExplosion(player.x, player.y, '#ff0000', 15);
            playSound('hit');
            enemyBullets.splice(i, 1);
            if (player.hp <= 0) triggerGameOver('被打中了！');
            continue;
        }

        if (eb.y > canvas.height + 20 || eb.y < -20 || eb.x < -20 || eb.x > canvas.width + 20) {
            enemyBullets.splice(i, 1);
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.life;
        if (p.alpha <= 0) particles.splice(i, 1);
    }

    // Floating Texts
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.02;
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
    }
}

function triggerGameOver(reason) {
    gameState = 'GAMEOVER';
    document.getElementById('gameover-reason').innerText = reason;
    document.getElementById('final-score').innerText = `最終得分: ${score}`;
    document.getElementById('gameover-overlay').classList.remove('hidden');
}

// Rendering
function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Starfield Background
    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    for (let i = 0; i < 25; i++) {
        let sx = (Math.sin(i * 99 + Date.now() * 0.001) * 0.5 + 0.5) * canvas.width;
        let sy = (Math.cos(i * 33 + Date.now() * 0.0015) * 0.5 + 0.5) * canvas.height;
        ctx.fillRect(sx, sy, 2, 2);
    }

    if (gameState === 'PLAYING') {
        // Player
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.beginPath();
        ctx.arc(0, 0, player.width / 2, 0, Math.PI * 2);
        ctx.clip();
        try {
            ctx.drawImage(imgPlayer, -player.width/2, -player.height/2, player.width, player.height);
        } catch(e) {
            ctx.fillStyle = '#00e5ff'; ctx.fill();
        }
        ctx.restore();

        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.width / 2 + 3, 0, Math.PI * 2);
        ctx.stroke();

        // Player Bullets
        ctx.fillStyle = (currentWave === 10) ? '#ffcc00' : '#00e5ff';
        playerBullets.forEach(b => {
            ctx.beginPath();
            ctx.arc(b.x, b.y, (currentWave === 10) ? 6 : 4, 0, Math.PI * 2);
            ctx.fill();
        });

        // Enemies
        enemies.forEach(e => {
            if (e.isDash && e.dashState === 'CHARGING') {
                ctx.strokeStyle = 'rgba(255, 0, 85, 0.7)';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                ctx.beginPath();
                ctx.moveTo(e.x, e.y);
                ctx.lineTo(player.x, player.y);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            ctx.save();
            ctx.translate(e.x, e.y);
            ctx.beginPath();
            ctx.arc(0, 0, e.width / 2, 0, Math.PI * 2);
            ctx.clip();
            try {
                ctx.drawImage(imgEnemy, -e.width/2, -e.height/2, e.width, e.height);
            } catch(err) {
                ctx.fillStyle = e.isDash ? '#ff0055' : '#ff9900';
                ctx.fill();
            }
            ctx.restore();

            ctx.strokeStyle = e.isDash ? '#ff0055' : '#ff9900';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.width / 2 + 2, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(e.x - 20, e.y - e.height / 2 - 10, 40, 5);
            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(e.x - 20, e.y - e.height / 2 - 10, (e.hp / e.maxHp) * 40, 5);
        });

        // Boss
        if (activeBoss) {
            ctx.save();
            ctx.translate(activeBoss.x, activeBoss.y);
            ctx.beginPath();
            ctx.arc(0, 0, activeBoss.width / 2, 0, Math.PI * 2);
            ctx.clip();
            try {
                ctx.drawImage(imgEnemy, -activeBoss.width/2, -activeBoss.height/2, activeBoss.width, activeBoss.height);
            } catch(e) {
                ctx.fillStyle = '#ff0055'; ctx.fill();
            }
            ctx.restore();

            ctx.strokeStyle = '#ff0055';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(activeBoss.x, activeBoss.y, activeBoss.width / 2 + 4, 0, Math.PI * 2);
            ctx.stroke();

            // Boss Health Bar Top
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(50, 45, canvas.width - 100, 16);
            ctx.fillStyle = '#ff0055';
            ctx.fillRect(50, 45, (activeBoss.hp / activeBoss.maxHp) * (canvas.width - 100), 16);
            ctx.strokeStyle = '#fff';
            ctx.strokeRect(50, 45, canvas.width - 100, 16);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`${activeBoss.name}: ${activeBoss.hp} / ${activeBoss.maxHp} HP`, canvas.width / 2, 58);
        }

        // Enemy Bullets
        enemyBullets.forEach(eb => {
            ctx.fillStyle = eb.color;
            ctx.beginPath();
            ctx.arc(eb.x, eb.y, 5, 0, Math.PI * 2);
            ctx.fill();
        });

        // Particles
        particles.forEach(p => {
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;

        // Floating Texts
        floatingTexts.forEach(ft => {
            ctx.globalAlpha = ft.alpha;
            ctx.fillStyle = ft.color;
            ctx.font = 'bold 16px Arial';
            ctx.fillText(ft.text, ft.x, ft.y);
        });
        ctx.globalAlpha = 1;

        // HUD Text
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'left';
        ctx.fillText(`SCORE: ${score} / 1000`, 20, 28);

        ctx.textAlign = 'center';
        ctx.fillText(`WAVE: ${currentWave} / 10`, canvas.width / 2, 28);

        ctx.textAlign = 'right';
        ctx.fillText(`HP: ${player.hp}/${player.maxHp}`, canvas.width - 20, 28);
    }
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
