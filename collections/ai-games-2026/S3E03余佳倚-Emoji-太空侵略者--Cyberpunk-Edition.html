<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji 太空侵略者 🚀 Cyberpunk Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-neon: #00f3ff;
            --secondary-neon: #ff0055;
            --accent-glow: #ffe600;
            --ult-color: #a855f7;
            --bg-color: #05050d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #0f1026 0%, #030308 100%);
        }

        #game-wrapper {
            position: relative;
            padding: 10px;
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(255, 0, 85, 0.2));
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.15), 0 0 100px rgba(255, 0, 85, 0.1);
            max-width: 100vw;
        }

        #game-container {
            position: relative;
            width: 600px;
            height: 650px;
            max-width: 95vw;
            max-height: 80vh;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #080812;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Glassmorphism UI Overlay 透明玻璃擬態 */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(8, 8, 18, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 10;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .ui-title {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
            background-image: linear-gradient(45deg, var(--primary-neon), #a855f7, var(--secondary-neon));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            margin-bottom: 12px;
            text-align: center;
        }

        .ui-desc {
            font-size: 14px;
            color: #a0a0c0;
            margin-bottom: 25px;
            text-align: center;
            line-height: 1.8;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .ui-desc kbd {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            padding: 2px 6px;
            color: var(--primary-neon);
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
        }

        .cyber-btn {
            background: transparent;
            border: 2px solid var(--primary-neon);
            color: var(--primary-neon);
            padding: 12px 36px;
            font-size: 18px;
            font-weight: 800;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            outline: none;
        }

        .cyber-btn:hover {
            background: var(--primary-neon);
            color: #000;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.8);
            transform: translateY(-2px);
        }

        /* 行動裝置虛擬按鈕 */
        .mobile-controls {
            display: none;
            justify-content: space-between;
            width: 100%;
            margin-top: 10px;
            gap: 8px;
        }

        @media (max-width: 768px) {
            .mobile-controls {
                display: flex;
            }
        }

        .touch-btn {
            flex: 1;
            padding: 12px 0;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: var(--primary-neon);
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            text-align: center;
            touch-action: manipulation;
        }

        .touch-btn:active {
            background: var(--primary-neon);
            color: #000;
        }

        .touch-ult {
            border-color: #a855f7;
            color: #a855f7;
        }

        .touch-ult.ready {
            background: #a855f7;
            color: #fff;
            box-shadow: 0 0 15px #a855f7;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="game-container">
            <canvas id="gameCanvas" width="600" height="650"></canvas>
            
            <div id="overlay" class="ui-overlay">
                <h1 id="overlay-title" class="ui-title">EMOJI INVADERS</h1>
                <p id="overlay-desc" class="ui-desc">
                    <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>A</kbd> <kbd>D</kbd> 控制火箭移動<br>
                    <kbd>SPACE</kbd> 發射霓虹雷射砲 | <kbd>SHIFT</kbd> 釋放終極大招<br>
                    消滅外星軍團充能，發射「終極貫穿死光」！
                </p>
                <button id="start-btn" class="cyber-btn">START GAME</button>
            </div>
        </div>

        <!-- 手機端觸控按鈕 -->
        <div class="mobile-controls">
            <button class="touch-btn" id="btn-left">◀</button>
            <button class="touch-btn" id="btn-shoot" style="border-color: var(--secondary-neon); color: var(--secondary-neon);">🔥 發射</button>
            <button class="touch-btn touch-ult" id="btn-ult">⚡ 大招</button>
            <button class="touch-btn" id="btn-right">▶</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const startBtn = document.getElementById('start-btn');
        const btnUlt = document.getElementById('btn-ult');

        // 遊戲狀態與數據
        let gameState = 'START';
        let score = 0;
        let highScore = parseInt(localStorage.getItem('emoji_invaders_hi'), 10) || 0;
        let combo = 0;
        let shakeTime = 0;

        // 終極大招 (ULTIMATE HYPER BEAM) 系統
        let ultEnergy = 0;
        const ultMax = 100;
        let isUltActive = false;
        let ultTimer = 0;
        const ultDuration = 80;

        // 監聽鍵盤
        const keys = { left: false, right: false, space: false };
        window.addEventListener('keydown', e => {
            if (['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD', 'Space', 'ShiftLeft', 'ShiftRight', 'KeyE'].includes(e.code)) {
                e.preventDefault();
            }
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'Space') keys.space = true;
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyE') triggerUltimate();
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'Space') keys.space = false;
        });

        // 手機觸控支援
        const setupTouchBtn = (id, action) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); action(true); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); action(false); });
            btn.addEventListener('mousedown', () => action(true));
            btn.addEventListener('mouseup', () => action(false));
        };
        setupTouchBtn('btn-left', val => keys.left = val);
        setupTouchBtn('btn-right', val => keys.right = val);
        setupTouchBtn('btn-shoot', val => keys.space = val);
        
        btnUlt.addEventListener('click', () => triggerUltimate());
        btnUlt.addEventListener('touchstart', (e) => { e.preventDefault(); triggerUltimate(); });

        function triggerUltimate() {
            if (gameState === 'PLAYING' && ultEnergy >= ultMax && !isUltActive) {
                isUltActive = true;
                ultTimer = ultDuration;
                ultEnergy = 0;
                btnUlt.classList.remove('ready');
                triggerShake(22);
                addFloatingText(player.x, player.y - 30, '⚡ HYPER BEAM!!', '#a855f7');
            }
        }

        // 1. 動態星空系統 (含透明度與閃爍效果)
        const stars = Array.from({ length: 70 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 1.5 + 0.2,
            alpha: Math.random() * 0.8 + 0.2,
            twinkleSpeed: Math.random() * 0.02 + 0.005
        }));

        // 2. 粒子系統
        let particles = [];
        function createExplosion(x, y, color, count = 18) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 1;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 4 + 2,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.015
                });
            }
        }

        // 3. 漂浮傷害數字系統
        let floatingTexts = [];
        function addFloatingText(x, y, text, color = '#00f3ff') {
            floatingTexts.push({ x, y, text, color, alpha: 1, vy: -1.5 });
        }

        // 玩家物件 (高速移動 speed: 11)
        const player = {
            x: canvas.width / 2 - 22,
            y: canvas.height - 70,
            width: 44,
            height: 44,
            speed: 11,
            lastShot: 0,
            shootDelay: 160
        };

        let playerBullets = [];
        let alienBullets = [];

        const alienTypes = ['🛸', '👾', '👽', '🤖'];
        const rows = 4;
        const cols = 8;
        const alienSize = 34;
        let aliens = [];
        let alienDir = 1;
        let alienStepSpeed = 1.2;
        let alienShootTimer = 0;

        function initAliens() {
            aliens = [];
            alienDir = 1;
            alienStepSpeed = 1.2;
            const paddingLeft = 55;
            const paddingTop = 70;
            const spacingX = 62;
            const spacingY = 48;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    aliens.push({
                        x: paddingLeft + c * spacingX,
                        y: paddingTop + r * spacingY,
                        width: alienSize,
                        height: alienSize,
                        type: alienTypes[r % alienTypes.length],
                        alive: true,
                        bobOffset: Math.random() * Math.PI * 2
                    });
                }
            }
        }

        startBtn.addEventListener('click', startGame);

        function startGame() {
            startBtn.blur();
            score = 0;
            combo = 0;
            ultEnergy = 0;
            isUltActive = false;
            btnUlt.classList.remove('ready');
            player.x = canvas.width / 2 - player.width / 2;
            playerBullets = [];
            alienBullets = [];
            particles = [];
            floatingTexts = [];
            initAliens();
            gameState = 'PLAYING';
            overlay.classList.add('hidden');
        }

        function triggerShake(intensity = 10) {
            shakeTime = intensity;
        }

        function gameOver(isWin) {
            gameState = isWin ? 'WIN' : 'GAMEOVER';
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('emoji_invaders_hi', highScore.toString());
            }
            overlayTitle.textContent = isWin ? 'MISSION PASSED' : 'GAME OVER';
            overlayTitle.style.backgroundImage = isWin 
                ? 'linear-gradient(45deg, #00f3ff, #00ff88)' 
                : 'linear-gradient(45deg, #ff0055, #ff5500)';
            
            overlayDesc.innerHTML = `${isWin ? '你成功瓦解了外星防線！' : '母艦已被外星軍團攻陷！'}<br>最終得分：<strong>${score}</strong> | 最高紀錄：<strong>${highScore}</strong>`;
            startBtn.textContent = 'RETRY';
            overlay.classList.remove('hidden');
        }

        function checkCollision(r1, r2) {
            return r1.x < r2.x + r2.width &&
                   r1.x + r1.width > r2.x &&
                   r1.y < r2.y + r2.height &&
                   r1.y + r1.height > r2.y;
        }

        // 邏輯更新
        function update() {
            stars.forEach(s => {
                s.y += s.speed;
                s.alpha += s.twinkleSpeed;
                if (s.alpha > 0.9 || s.alpha < 0.2) s.twinkleSpeed *= -1; // 星光微幅呼吸閃爍
                if (s.y > canvas.height) {
                    s.y = 0;
                    s.x = Math.random() * canvas.width;
                }
            });

            if (gameState !== 'PLAYING') return;

            if (shakeTime > 0) shakeTime--;

            if (keys.left && player.x > 10) player.x -= player.speed;
            if (keys.right && player.x + player.width < canvas.width - 10) player.x += player.speed;

            if (Math.random() < 0.6) {
                particles.push({
                    x: player.x + player.width / 2 + (Math.random() * 12 - 6),
                    y: player.y + player.height - 5,
                    vx: (Math.random() - 0.5) * 1,
                    vy: Math.random() * 3 + 2,
                    size: Math.random() * 3 + 1,
                    color: isUltActive ? '#a855f7' : '#00f3ff',
                    alpha: 0.8,
                    decay: 0.05
                });
            }

            const now = Date.now();
            if (keys.space && now - player.lastShot > player.shootDelay) {
                playerBullets.push({
                    x: player.x + player.width / 2 - 2.5,
                    y: player.y - 12,
                    width: 5,
                    height: 16,
                    speed: 10
                });
                player.lastShot = now;
            }

            // 大招邏輯
            if (isUltActive) {
                ultTimer--;
                triggerShake(3);

                const beamWidth = 70;
                const beamRect = {
                    x: player.x + player.width / 2 - beamWidth / 2,
                    y: 0,
                    width: beamWidth,
                    height: player.y
                };

                for (let i = alienBullets.length - 1; i >= 0; i--) {
                    if (checkCollision(beamRect, alienBullets[i])) {
                        createExplosion(alienBullets[i].x, alienBullets[i].y, '#a855f7', 6);
                        alienBullets.splice(i, 1);
                    }
                }

                aliens.forEach(a => {
                    if (a.alive && checkCollision(beamRect, a)) {
                        a.alive = false;
                        combo++;
                        const pts = 15 + combo * 3;
                        score += pts;
                        ultEnergy = Math.min(ultMax, ultEnergy + 5);
                        createExplosion(a.x + a.width / 2, a.y + a.height / 2, '#a855f7', 22);
                        addFloatingText(a.x + a.width / 2, a.y, `+${pts}`, '#ffe600');
                        alienStepSpeed += 0.05;
                    }
                });

                if (ultTimer <= 0) isUltActive = false;
            }

            // 一般子彈處理
            for (let i = playerBullets.length - 1; i >= 0; i--) {
                let b = playerBullets[i];
                b.y -= b.speed;

                if (b.y < -20) {
                    playerBullets.splice(i, 1);
                    combo = 0;
                    continue;
                }

                for (let j = 0; j < aliens.length; j++) {
                    let a = aliens[j];
                    if (a.alive && checkCollision(b, a)) {
                        a.alive = false;
                        combo++;
                        const pts = 10 + combo * 2;
                        score += pts;
                        
                        if (ultEnergy < ultMax) {
                            ultEnergy = Math.min(ultMax, ultEnergy + 15);
                            if (ultEnergy >= ultMax) {
                                btnUlt.classList.add('ready');
                                addFloatingText(player.x, player.y - 20, 'ULT READY!', '#a855f7');
                            }
                        }

                        createExplosion(a.x + a.width / 2, a.y + a.height / 2, '#ff0055', 16);
                        addFloatingText(a.x + a.width / 2, a.y, `+${pts}`, combo > 2 ? '#ffe600' : '#00f3ff');
                        triggerShake(4);

                        playerBullets.splice(i, 1);
                        alienStepSpeed += 0.04;
                        break;
                    }
                }
            }

            if (aliens.every(a => !a.alive)) {
                gameOver(true);
                return;
            }

            let reachEdge = false;
            let lowestAlienY = 0;

            aliens.forEach(a => {
                if (!a.alive) return;
                a.x += alienDir * alienStepSpeed;
                a.bobOffset += 0.05;

                if (a.y + a.height > lowestAlienY) lowestAlienY = a.y + a.height;

                if ((alienDir > 0 && a.x + a.width >= canvas.width - 20) || 
                    (alienDir < 0 && a.x <= 20)) {
                    reachEdge = true;
                }
            });

            if (lowestAlienY >= player.y) {
                createExplosion(player.x + player.width/2, player.y + player.height/2, '#00f3ff', 40);
                gameOver(false);
                return;
            }

            if (reachEdge) {
                alienDir *= -1;
                aliens.forEach(a => { if (a.alive) a.y += 18; });
                alienStepSpeed += 0.12;
            }

            alienShootTimer++;
            if (alienShootTimer > Math.max(18, 55 - score / 15)) {
                const activeAliens = aliens.filter(a => a.alive);
                if (activeAliens.length > 0) {
                    const shooter = activeAliens[Math.floor(Math.random() * activeAliens.length)];
                    alienBullets.push({
                        x: shooter.x + shooter.width / 2 - 3,
                        y: shooter.y + shooter.height,
                        width: 6,
                        height: 14,
                        speed: 4.5 + Math.min(score / 80, 3.5)
                    });
                }
                alienShootTimer = 0;
            }

            for (let i = alienBullets.length - 1; i >= 0; i--) {
                let ab = alienBullets[i];
                ab.y += ab.speed;

                if (checkCollision(ab, player)) {
                    createExplosion(player.x + player.width/2, player.y + player.height/2, '#00f3ff', 35);
                    triggerShake(20);
                    gameOver(false);
                    return;
                }

                if (ab.y > canvas.height + 20) alienBullets.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.alpha -= 0.025;
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }
        }

        // 畫面繪製
        function render() {
            ctx.save();

            if (shakeTime > 0) {
                const dx = (Math.random() - 0.5) * shakeTime;
                const dy = (Math.random() - 0.5) * shakeTime;
                ctx.translate(dx, dy);
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 星空 (繪製獨立透明度)
            stars.forEach(s => {
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, Math.min(1, s.alpha))})`;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });

            // 防禦警戒線 (50% 半透明)
            ctx.strokeStyle = 'rgba(255, 0, 85, 0.5)';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 8]);
            ctx.beginPath();
            ctx.moveTo(0, player.y);
            ctx.lineTo(canvas.width, player.y);
            ctx.stroke();
            ctx.setLineDash([]);

            // 巨型貫穿死光 (分層 Alpha 漸層)
            if (isUltActive) {
                const beamW = 70 + Math.sin(Date.now() * 0.05) * 10;
                const beamX = player.x + player.width / 2 - beamW / 2;

                ctx.shadowBlur = 30;
                ctx.shadowColor = '#a855f7';
                ctx.fillStyle = 'rgba(168, 85, 247, 0.6)';
                ctx.fillRect(beamX, 0, beamW, player.y);

                ctx.fillStyle = 'rgba(0, 243, 255, 0.8)';
                ctx.fillRect(beamX + 10, 0, beamW - 20, player.y);

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(beamX + 20, 0, beamW - 40, player.y);

                ctx.shadowBlur = 0;
            }

            // 玩家火箭 🚀
            const fontSize = 36;
            ctx.font = `${fontSize}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.filter = isUltActive 
                ? 'brightness(1.8) saturate(1.8) drop-shadow(0 0 20px #a855f7)'
                : 'brightness(1.55) saturate(1.35) drop-shadow(0 0 12px #00f3ff)';
            ctx.shadowBlur = isUltActive ? 30 : 25;
            ctx.shadowColor = isUltActive ? '#a855f7' : '#00f3ff';
            ctx.fillText('🚀', player.x + player.width / 2, player.y + (player.height - fontSize) / 2);
            ctx.shadowBlur = 0;
            ctx.filter = 'none';

            // 普通雷射
            playerBullets.forEach(b => {
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#00f3ff';
                ctx.fillStyle = '#00f3ff';
                ctx.fillRect(b.x, b.y, b.width, b.height);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(b.x + 1, b.y + 2, b.width - 2, b.height - 4);
            });
            ctx.shadowBlur = 0;

            // 外星人
            ctx.filter = 'brightness(1.5) saturate(1.4) drop-shadow(0 0 10px #ff00ea)';
            ctx.shadowBlur = 18;
            ctx.shadowColor = '#ff00ea';
            aliens.forEach(a => {
                if (a.alive) {
                    const bobY = Math.sin(a.bobOffset) * 3;
                    ctx.font = '30px sans-serif';
                    ctx.fillText(a.type, a.x + a.width / 2, a.y + (a.height - 30) / 2 + bobY);
                }
            });
            ctx.shadowBlur = 0;
            ctx.filter = 'none';

            // 外星人砲彈
            alienBullets.forEach(ab => {
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff0055';
                ctx.fillStyle = '#ff0055';
                ctx.fillRect(ab.x, ab.y, ab.width, ab.height);
            });
            ctx.shadowBlur = 0;

            // 粒子繪製 (精準控制衰減 globalAlpha)
            particles.forEach(p => {
                ctx.globalAlpha = Math.max(0, Math.min(1, p.alpha));
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            // 漂浮傷害數字 (精準控制衰減 globalAlpha)
            floatingTexts.forEach(ft => {
                ctx.globalAlpha = Math.max(0, Math.min(1, ft.alpha));
                ctx.fillStyle = ft.color;
                ctx.font = '900 16px Orbitron';
                ctx.fillText(ft.text, ft.x, ft.y);
            });
            ctx.globalAlpha = 1;

            // HUD 資訊
            ctx.fillStyle = '#00f3ff';
            ctx.font = '800 18px Orbitron';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 20, 35);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.font = '600 14px Orbitron';
            ctx.textAlign = 'right';
            ctx.fillText(`HI: ${highScore}`, canvas.width - 20, 35);

            if (combo > 1) {
                ctx.fillStyle = '#ffe600';
                ctx.font = '900 14px Orbitron';
                ctx.textAlign = 'left';
                ctx.fillText(`${combo}x COMBO!`, 20, 60);
            }

            // 大招能量條 HUD (透明度層次)
            const barW = 140;
            const barH = 10;
            const barX = canvas.width - 20 - barW;
            const barY = 50;

            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.strokeStyle = ultEnergy >= ultMax ? '#a855f7' : 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1;
            ctx.strokeRect(barX, barY, barW, barH);

            const fillW = (ultEnergy / ultMax) * barW;
            ctx.fillStyle = ultEnergy >= ultMax ? '#a855f7' : '#00f3ff';
            if (ultEnergy >= ultMax) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#a855f7';
            }
            ctx.fillRect(barX, barY, fillW, barH);
            ctx.shadowBlur = 0;

            ctx.fillStyle = ultEnergy >= ultMax ? '#a855f7' : 'rgba(255, 255, 255, 0.6)';
            ctx.font = '800 11px Orbitron';
            ctx.textAlign = 'right';
            ctx.fillText(ultEnergy >= ultMax ? 'ULT READY [SHIFT]' : `ULT: ${Math.floor(ultEnergy)}%`, canvas.width - 20, 75);

            ctx.restore();
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
