<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空侵略者 Space Invaders - Arcade Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #05050d;
            color: #fff;
            user-select: none;
            overflow: hidden;
        }
        .retro-border {
            border: 4px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4), inset 0 0 15px rgba(0, 255, 204, 0.2);
        }
        .arcade-btn {
            background: linear-gradient(180deg, #ff0055 0%, #990033 100%);
            box-shadow: 0 5px 0 #55001c, 0 10px 10px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
        }
        .arcade-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #55001c, 0 3px 5px rgba(0,0,0,0.5);
        }
        canvas {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 md:p-4">

    <div class="flex flex-col items-center max-w-full">
        <!-- 標題與 Arcade 霓虹燈效果 -->
        <h1 class="text-xl md:text-3xl text-center mb-2 tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-green-400 via-cyan-400 to-pink-500 drop-shadow-[0_0_10px_rgba(0,255,204,0.8)]">
            SPACE INVADERS
        </h1>

        <!-- 遊戲主畫布與 overlay 包裹層 -->
        <div class="relative retro-border rounded-lg overflow-hidden bg-black">
            <canvas id="gameCanvas" width="800" height="600" class="block w-full max-w-[800px] h-auto aspect-[4/3]"></canvas>

            <!-- 操作提示列 -->
            <div class="hidden sm:flex justify-between items-center bg-gray-900/90 text-[10px] md:text-xs px-4 py-2 text-cyan-300 border-t border-cyan-800">
                <span>[←/→] 或 [A/D] : 移動</span>
                <span>[SPACE] : 射擊</span>
                <span>[P] : 暫停</span>
                <span>[M] : 音效切換</span>
            </div>
        </div>

        <!-- 畫面下方行動裝置可用的虛擬控制器 -->
        <div class="sm:hidden flex justify-between items-center w-full max-w-[800px] mt-3 px-2 gap-2">
            <div class="flex gap-2">
                <button id="btnLeft" class="arcade-btn px-6 py-4 rounded text-lg font-bold">←</button>
                <button id="btnRight" class="arcade-btn px-6 py-4 rounded text-lg font-bold">→</button>
            </div>
            <button id="btnShoot" class="arcade-btn px-8 py-4 rounded text-lg font-bold bg-gradient-to-r from-yellow-500 to-red-500">FIRE</button>
        </div>
    </div>

    <script>
        // Web Audio 8-bit 音效產生器，免去載入外部 mp3 失敗的問題
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playTone(freq, type, duration, startVol = 0.1, endVol = 0.01) {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(startVol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(endVol, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            }

            shoot() {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.15);
                } catch(e){}
            }

            explosion() {
                if (this.muted || !this.ctx) return;
                try {
                    const bufferSize = this.ctx.sampleRate * 0.25;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(800, this.ctx.currentTime);
                    filter.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.25);
                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    noise.start();
                } catch(e){}
            }

            powerup() {
                this.playTone(300, 'sine', 0.1, 0.15, 0.05);
                setTimeout(() => this.playTone(600, 'sine', 0.15, 0.15, 0.01), 80);
            }

            ufoSound() {
                this.playTone(880, 'triangle', 0.08, 0.05, 0.01);
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const sfx = new SoundFX();

        // 遊戲狀態常量
        const STATES = { START: 0, PLAYING: 1, PAUSED: 2, GAMEOVER: 3, VICTORY: 4 };
        let gameState = STATES.START;

        // 全域遊戲數值
        let score = 0;
        let highScore = localStorage.getItem('invaders_highscore') || 0;
        let level = 1;
        let lives = 3;
        let combo = 0;
        let comboTimer = 0;
        let screenShake = 0;

        // 背景星空
        const stars = Array.from({ length: 60 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 0.8 + 0.2,
            brightness: Math.random()
        }));

        class Player {
            constructor() {
                this.width = 44;
                this.height = 24;
                this.x = canvas.width / 2 - this.width / 2;
                this.y = canvas.height - 50;
                this.speed = 6;
                this.cooldown = 0;
                this.maxCooldown = 15;
                this.hasDoubleShot = false;
                this.hasShield = false;
                this.doubleShotTimer = 0;
                this.shieldTimer = 0;
            }

            update(keys) {
                // 移動邏輯
                if ((keys['ArrowLeft'] || keys['KeyA']) && this.x > 10) {
                    this.x -= this.speed;
                }
                if ((keys['ArrowRight'] || keys['KeyD']) && this.x < canvas.width - this.width - 10) {
                    this.x += this.speed;
                }

                // 冷卻機制
                if (this.cooldown > 0) this.cooldown--;

                // 道具計時器
                if (this.doubleShotTimer > 0) {
                    this.doubleShotTimer--;
                    if (this.doubleShotTimer <= 0) this.hasDoubleShot = false;
                }
                if (this.shieldTimer > 0) {
                    this.shieldTimer--;
                    if (this.shieldTimer <= 0) this.hasShield = false;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // 繪製飛船 (復古像素火箭體)
                ctx.fillStyle = '#00ffcc';
                ctx.fillRect(18, 0, 8, 4);
                ctx.fillRect(16, 4, 12, 4);
                ctx.fillRect(14, 8, 16, 4);
                ctx.fillRect(4, 12, 36, 6);
                ctx.fillRect(0, 18, 44, 6);

                // 噴射引擎火苗
                if (Math.random() > 0.3) {
                    ctx.fillStyle = '#ff6600';
                    ctx.fillRect(12, 24, 6, 4);
                    ctx.fillRect(26, 24, 6, 4);
                    ctx.fillStyle = '#ffff00';
                    ctx.fillRect(14, 28, 2, 3);
                    ctx.fillRect(28, 28, 2, 3);
                }

                // 護盾光圈
                if (this.hasShield) {
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(this.width / 2, this.height / 2, 32, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.restore();
            }

            shoot(bullets) {
                if (this.cooldown <= 0) {
                    sfx.shoot();
                    if (this.hasDoubleShot) {
                        bullets.push(new Bullet(this.x + 8, this.y, -9, true));
                        bullets.push(new Bullet(this.x + this.width - 8, this.y, -9, true));
                    } else {
                        bullets.push(new Bullet(this.x + this.width / 2 - 2, this.y, -9, true));
                    }
                    this.cooldown = this.maxCooldown;
                }
            }
        }

        class Bullet {
            constructor(x, y, speedY, isPlayer = false, color = '#ffff00') {
                this.x = x;
                this.y = y;
                this.width = isPlayer ? 4 : 4;
                this.height = isPlayer ? 12 : 10;
                this.speedY = speedY;
                this.isPlayer = isPlayer;
                this.color = isPlayer ? '#00ffff' : color;
            }

            update() {
                this.y += this.speedY;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 6;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.shadowBlur = 0;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.size = Math.random() * 3 + 2;
                this.color = color;
                this.life = 1.0;
                this.decay = Math.random() * 0.04 + 0.02;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }

        class PowerUp {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'DOUBLE' or 'SHIELD'
                this.width = 20;
                this.height = 20;
                this.speedY = 2;
            }

            update() {
                this.y += this.speedY;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                if (this.type === 'DOUBLE') {
                    ctx.fillStyle = '#ff00ff';
                    ctx.fillRect(2, 2, 16, 16);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '10px "Press Start 2P"';
                    ctx.fillText('2X', 2, 14);
                } else {
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(2, 2, 16, 16);
                    ctx.fillStyle = '#000000';
                    ctx.font = '10px "Press Start 2P"';
                    ctx.fillText('S', 5, 14);
                }
                ctx.restore();
            }
        }

        class Alien {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.width = 32;
                this.height = 24;
                this.type = type; // 0: squid, 1: crab, 2: octopus
                this.frame = 0;
                this.alive = true;

                // 依種類設置色彩與分數
                if (type === 0) { this.color = '#ff0055'; this.scoreVal = 30; }
                else if (type === 1) { this.color = '#ffcc00'; this.scoreVal = 20; }
                else { this.color = '#33ff55'; this.scoreVal = 10; }
            }

            draw() {
                if (!this.alive) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = this.color;

                // 使用 8x6 像素網格繪製 3 種造型外星人，每種有 2 幀動作
                if (this.type === 0) { // Squid
                    if (this.frame === 0) {
                        ctx.fillRect(12,0,8,4); ctx.fillRect(8,4,16,4); ctx.fillRect(4,8,24,4);
                        ctx.fillRect(0,12,32,4); ctx.fillRect(8,16,4,8); ctx.fillRect(20,16,4,8);
                    } else {
                        ctx.fillRect(12,0,8,4); ctx.fillRect(8,4,16,4); ctx.fillRect(4,8,24,4);
                        ctx.fillRect(0,12,32,4); ctx.fillRect(0,16,4,8); ctx.fillRect(28,16,4,8);
                    }
                } else if (this.type === 1) { // Crab
                    if (this.frame === 0) {
                        ctx.fillRect(4,0,4,4); ctx.fillRect(24,0,4,4); ctx.fillRect(8,4,16,4);
                        ctx.fillRect(4,8,24,4); ctx.fillRect(0,12,32,4); ctx.fillRect(8,16,4,8); ctx.fillRect(20,16,4,8);
                    } else {
                        ctx.fillRect(4,0,4,4); ctx.fillRect(24,0,4,4); ctx.fillRect(8,4,16,4);
                        ctx.fillRect(4,8,24,4); ctx.fillRect(0,12,32,4); ctx.fillRect(0,8,4,8); ctx.fillRect(28,8,4,8);
                    }
                } else { // Octopus
                    if (this.frame === 0) {
                        ctx.fillRect(8,0,16,4); ctx.fillRect(4,4,24,4); ctx.fillRect(0,8,32,4);
                        ctx.fillRect(0,12,32,4); ctx.fillRect(4,16,8,8); ctx.fillRect(20,16,8,8);
                    } else {
                        ctx.fillRect(8,0,16,4); ctx.fillRect(4,4,24,4); ctx.fillRect(0,8,32,4);
                        ctx.fillRect(0,12,32,4); ctx.fillRect(0,16,4,8); ctx.fillRect(28,16,4,8);
                    }
                }

                ctx.restore();
            }
        }

        class UFO {
            constructor() {
                this.width = 48;
                this.height = 20;
                this.x = -this.width;
                this.y = 45;
                this.speed = 3;
                this.alive = true;
                this.scoreVal = Math.floor(Math.random() * 3 + 1) * 100;
            }

            update() {
                this.x += this.speed;
                if (this.x % 20 < 3) sfx.ufoSound();
                if (this.x > canvas.width + 50) this.alive = false;
            }

            draw() {
                if (!this.alive) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(12, 0, 24, 4);
                ctx.fillRect(8, 4, 32, 4);
                ctx.fillRect(4, 8, 40, 4);
                ctx.fillRect(0, 12, 48, 4);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(10, 8, 6, 4);
                ctx.fillRect(22, 8, 6, 4);
                ctx.fillRect(34, 8, 6, 4);
                ctx.restore();
            }
        }

        let player = new Player();
        let aliens = [];
        let playerBullets = [];
        let enemyBullets = [];
        let particles = [];
        let powerups = [];
        let ufo = null;

        let alienDirection = 1;
        let alienStepTimer = 0;
        let alienStepInterval = 40; // 越小越快
        let ufoSpawnTimer = 0;
        const keys = {};

        // 初始化外星人陣列 (Step 4)
        function initAliens() {
            aliens = [];
            const rows = 5;
            const cols = 10;
            const startX = 80;
            const startY = 80;
            const paddingX = 20;
            const paddingY = 16;

            for (let r = 0; r < rows; r++) {
                let type = 2; // Bottom rows (Octopus)
                if (r === 0) type = 0; // Top row (Squid)
                else if (r === 1 || r === 2) type = 1; // Middle rows (Crab)

                for (let c = 0; c < cols; c++) {
                    const x = startX + c * (32 + paddingX);
                    const y = startY + r * (24 + paddingY);
                    aliens.push(new Alien(x, y, type));
                }
            }
            alienDirection = 1;
            // 隨關卡提升加快初始速度
            alienStepInterval = Math.max(10, 45 - (level - 1) * 5);
        }

        // 重新開始遊戲
        function resetGame(fullReset = true) {
            if (fullReset) {
                score = 0;
                lives = 3;
                level = 1;
            }
            combo = 0;
            player = new Player();
            playerBullets = [];
            enemyBullets = [];
            particles = [];
            powerups = [];
            ufo = null;
            initAliens();
        }

        window.addEventListener('keydown', e => {
            sfx.init();
            keys[e.code] = true;

            if (e.code === 'KeyP' && gameState === STATES.PLAYING) {
                gameState = STATES.PAUSED;
            } else if (e.code === 'KeyP' && gameState === STATES.PAUSED) {
                gameState = STATES.PLAYING;
            } else if (e.code === 'KeyM') {
                sfx.muted = !sfx.muted;
            }

            // 選單模式下的按鍵觸發開始
            if ((gameState === STATES.START || gameState === STATES.GAMEOVER || gameState === STATES.VICTORY) && e.code === 'Space') {
                resetGame(gameState === STATES.GAMEOVER || gameState === STATES.START);
                gameState = STATES.PLAYING;
            }
        });

        window.addEventListener('keyup', e => {
            keys[e.code] = false;
        });

        // 移動端虛擬按鈕支援
        const bindTouchBtn = (id, code) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); sfx.init(); keys[code] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[code] = false; });
            btn.addEventListener('mousedown', () => { sfx.init(); keys[code] = true; });
            btn.addEventListener('mouseup', () => { keys[code] = false; });
        };

        bindTouchBtn('btnLeft', 'ArrowLeft');
        bindTouchBtn('btnRight', 'ArrowRight');
        bindTouchBtn('btnShoot', 'Space');

        // 畫布點擊觸發開始
        canvas.addEventListener('click', () => {
            sfx.init();
            if (gameState === STATES.START || gameState === STATES.GAMEOVER || gameState === STATES.VICTORY) {
                resetGame(gameState === STATES.GAMEOVER || gameState === STATES.START);
                gameState = STATES.PLAYING;
            }
        });

        function update() {
            if (gameState !== STATES.PLAYING) return;

            // 畫面震動遞減
            if (screenShake > 0) screenShake--;

            // Combo 計時器遞減
            if (comboTimer > 0) {
                comboTimer--;
                if (comboTimer <= 0) combo = 0;
            }

            // 1. 玩家更新與射擊
            player.update(keys);
            if (keys['Space']) {
                player.shoot(playerBullets);
            }

            // 2. 玩家子彈移動與邊界清理
            playerBullets.forEach((b, index) => {
                b.update();
                if (b.y < -20) playerBullets.splice(index, 1);
            });

            // 3. 敵方子彈移動
            enemyBullets.forEach((b, index) => {
                b.update();
                if (b.y > canvas.height + 20) enemyBullets.splice(index, 1);
            });

            // 4. 外星人大軍移動 (Step 5)
            alienStepTimer++;
            const aliveAliens = aliens.filter(a => a.alive);

            // 勝利判斷 (全滅)
            if (aliveAliens.length === 0) {
                level++;
                gameState = STATES.VICTORY;
                sfx.powerup();
                return;
            }

            if (alienStepTimer >= alienStepInterval) {
                alienStepTimer = 0;
                let reachEdge = false;

                // 檢查是否碰到邊緣
                aliveAliens.forEach(alien => {
                    alien.frame = alien.frame === 0 ? 1 : 0; // 切換動作
                    if ((alienDirection === 1 && alien.x >= canvas.width - alien.width - 15) ||
                        (alienDirection === -1 && alien.x <= 15)) {
                        reachEdge = true;
                    }
                });

                if (reachEdge) {
                    alienDirection *= -1;
                    aliveAliens.forEach(alien => {
                        alien.y += 18; // 觸邊下沉
                        // 外星人觸及底線 Game Over (Step 7)
                        if (alien.y + alien.height >= player.y - 10) {
                            gameState = STATES.GAMEOVER;
                            sfx.explosion();
                        }
                    });
                    // 每下沉一次加快移動頻率
                    alienStepInterval = Math.max(4, alienStepInterval - 2);
                } else {
                    aliveAliens.forEach(alien => {
                        alien.x += alienDirection * 10;
                    });
                }
            }

            // 5. 外星人隨機反擊發射子彈 (Step 7)
            if (aliveAliens.length > 0 && Math.random() < 0.02 + (level * 0.005)) {
                const randomAlien = aliveAliens[Math.floor(Math.random() * aliveAliens.length)];
                enemyBullets.push(new Bullet(randomAlien.x + randomAlien.width / 2, randomAlien.y + randomAlien.height, 4 + level * 0.5, false, '#ff0055'));
            }

            // 6. UFO 出現與移動邏輯
            ufoSpawnTimer++;
            if (!ufo && ufoSpawnTimer > 700) {
                if (Math.random() < 0.5) {
                    ufo = new UFO();
                }
                ufoSpawnTimer = 0;
            }
            if (ufo) {
                ufo.update();
                if (!ufo.alive) ufo = null;
            }

            // 7. 碰撞偵測 (Step 6)
            // (A) 玩家子彈擊中外星人
            playerBullets.forEach((bullet, bIndex) => {
                aliens.forEach(alien => {
                    if (alien.alive &&
                        bullet.x < alien.x + alien.width &&
                        bullet.x + bullet.width > alien.x &&
                        bullet.y < alien.y + alien.height &&
                        bullet.y + bullet.height > alien.y) {

                        alien.alive = false;
                        playerBullets.splice(bIndex, 1);
                        sfx.explosion();

                        // 分數與 Combo
                        combo++;
                        comboTimer = 120;
                        const addedScore = alien.scoreVal * combo;
                        score += addedScore;
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('invaders_highscore', highScore);
                        }

                        // 爆炸粒子特效
                        for (let i = 0; i < 12; i++) {
                            particles.push(new Particle(alien.x + 16, alien.y + 12, alien.color));
                        }

                        // 隨機掉落強化道具 (Step 9 特色)
                        if (Math.random() < 0.12) {
                            const pType = Math.random() < 0.5 ? 'DOUBLE' : 'SHIELD';
                            powerups.push(new PowerUp(alien.x + 8, alien.y, pType));
                        }

                        // 動態加速：外星人越少移動越快
                        alienStepInterval = Math.max(2, Math.floor(alienStepInterval * 0.97));
                    }
                });

                // (B) 玩家子彈擊中 UFO
                if (ufo && ufo.alive &&
                    bullet.x < ufo.x + ufo.width &&
                    bullet.x + bullet.width > ufo.x &&
                    bullet.y < ufo.y + ufo.height &&
                    bullet.y + bullet.height > ufo.y) {

                    score += ufo.scoreVal;
                    ufo.alive = false;
                    playerBullets.splice(bIndex, 1);
                    sfx.powerup();
                    screenShake = 10;

                    for (let i = 0; i < 20; i++) {
                        particles.push(new Particle(ufo.x + 24, ufo.y + 10, '#ff0000'));
                    }
                }
            });

            // (C) 敵方子彈擊中玩家
            enemyBullets.forEach((bullet, bIndex) => {
                if (bullet.x < player.x + player.width &&
                    bullet.x + bullet.width > player.x &&
                    bullet.y < player.y + player.height &&
                    bullet.y + bullet.height > player.y) {

                    enemyBullets.splice(bIndex, 1);

                    if (player.hasShield) {
                        player.hasShield = false;
                        player.shieldTimer = 0;
                        sfx.explosion();
                    } else {
                        lives--;
                        sfx.explosion();
                        screenShake = 15;
                        for (let i = 0; i < 25; i++) {
                            particles.push(new Particle(player.x + 22, player.y + 12, '#00ffcc'));
                        }

                        if (lives <= 0) {
                            gameState = STATES.GAMEOVER;
                        }
                    }
                }
            });

            // (D) 玩家吃強化道具
            powerups.forEach((powerup, pIndex) => {
                powerup.update();
                if (powerup.x < player.x + player.width &&
                    powerup.x + powerup.width > player.x &&
                    powerup.y < player.y + player.height &&
                    powerup.y + powerup.height > player.y) {

                    sfx.powerup();
                    if (powerup.type === 'DOUBLE') {
                        player.hasDoubleShot = true;
                        player.doubleShotTimer = 400;
                    } else {
                        player.hasShield = true;
                        player.shieldTimer = 600;
                    }
                    powerups.splice(pIndex, 1);
                } else if (powerup.y > canvas.height + 20) {
                    powerups.splice(pIndex, 1);
                }
            });

            // 8. 粒子系統更新
            particles.forEach((p, index) => {
                p.update();
                if (p.life <= 0) particles.splice(index, 1);
            });
        }

        function draw() {
            ctx.save();

            // 應用震動效果
            if (screenShake > 0) {
                const offsetX = (Math.random() - 0.5) * screenShake;
                const offsetY = (Math.random() - 0.5) * screenShake;
                ctx.translate(offsetX, offsetY);
            }

            // 清空畫面背景
            ctx.fillStyle = '#05050d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 繪製動態星空
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > canvas.height) s.y = 0;
                ctx.fillStyle = `rgba(255, 255, 255, ${s.brightness})`;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });

            // 畫頂部綠色復古分隔線
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(10, 35);
            ctx.lineTo(canvas.width - 10, 35);
            ctx.stroke();

            // 畫 HUD 資訊 (分數、高分、等級、生命)
            ctx.font = '12px "Press Start 2P"';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`SCORE: ${score}`, 15, 24);
            ctx.fillText(`HIGH: ${highScore}`, 300, 24);
            ctx.fillText(`LVL: ${level}`, 680, 24);

            // 繪製剩餘生命 (用小型玩家飛船代表)
            ctx.fillText('LIVES:', 15, canvas.height - 15);
            for (let i = 0; i < lives; i++) {
                ctx.fillStyle = '#00ffcc';
                ctx.fillRect(110 + i * 25, canvas.height - 24, 16, 10);
            }

            // Combo 提示
            if (combo > 1) {
                ctx.fillStyle = '#ffff00';
                ctx.fillText(`${combo}X COMBO!`, 620, canvas.height - 15);
            }

            if (gameState === STATES.PLAYING || gameState === STATES.PAUSED) {
                // 繪製遊戲實體
                player.draw();
                aliens.forEach(a => a.draw());
                if (ufo) ufo.draw();
                playerBullets.forEach(b => b.draw());
                enemyBullets.forEach(b => b.draw());
                powerups.forEach(p => p.draw());
                particles.forEach(p => p.draw());

                if (gameState === STATES.PAUSED) {
                    drawOverlay('PAUSED', 'Press P to Resume', '#ffff00');
                }
            } else if (gameState === STATES.START) {
                drawStartScreen();
            } else if (gameState === STATES.GAMEOVER) {
                drawOverlay('GAME OVER', `FINAL SCORE: ${score}`, '#ff0055', 'Press SPACE to Restart');
            } else if (gameState === STATES.VICTORY) {
                drawOverlay('LEVEL CLEAR!', 'GREAT JOB!', '#00ffcc', 'Press SPACE for Next Level');
            }

            ctx.restore();
        }

        function drawStartScreen() {
            ctx.fillStyle = '#00ffcc';
            ctx.font = '22px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.fillText('SPACE INVADERS', canvas.width / 2, 180);

            ctx.fillStyle = '#ffffff';
            ctx.font = '12px "Press Start 2P"';
            ctx.fillText('SCORE TABLE', canvas.width / 2, 250);

            // 繪製計分說明
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(canvas.width / 2 - 80, 280, 24, 12);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(' = MYSTERY UFO', canvas.width / 2 + 30, 292);

            ctx.fillStyle = '#ff0055';
            ctx.fillRect(canvas.width / 2 - 80, 320, 20, 15);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(' = 30 PTS', canvas.width / 2 + 10, 332);

            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(canvas.width / 2 - 80, 360, 20, 15);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(' = 20 PTS', canvas.width / 2 + 10, 372);

            ctx.fillStyle = '#33ff55';
            ctx.fillRect(canvas.width / 2 - 80, 400, 20, 15);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(' = 10 PTS', canvas.width / 2 + 10, 412);

            ctx.fillStyle = '#ffff00';
            ctx.font = '14px "Press Start 2P"';
            if (Math.floor(Date.now() / 500) % 2 === 0) {
                ctx.fillText('PRESS SPACE TO START', canvas.width / 2, 490);
            }
            ctx.textAlign = 'left';
        }

        function drawOverlay(title, subtitle, titleColor, actionText = '') {
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = 'center';
            ctx.fillStyle = titleColor;
            ctx.font = '26px "Press Start 2P"';
            ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 40);

            ctx.fillStyle = '#ffffff';
            ctx.font = '14px "Press Start 2P"';
            ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 10);

            if (actionText) {
                ctx.fillStyle = '#ffff00';
                ctx.font = '12px "Press Start 2P"';
                if (Math.floor(Date.now() / 500) % 2 === 0) {
                    ctx.fillText(actionText, canvas.width / 2, canvas.height / 2 + 70);
                }
            }
            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        window.onload = function() {
            gameLoop();
        };
    </script>
</body>
</html>
